ui.github: GitHub
ui.helpButton: 帮助
ui.helpTitle: 帮助
ui.helpContent: "你是一名 AI 方向的博士生。每个月选择 **一项** 行动。研究流水线：刷 arXiv → 想法 → 跑实验（消耗 **算力**）→ 小规模结果 → 扩展（或砸大算力 **训练大模型**）→ SOTA 结果 → 消融/画图 → 写初稿 → **在真实会议截稿点投稿**（ICLR、ICML、NeurIPS、CVPR）→ 等几个月出结果。管理好你的 **GPU 算力**（左上角）——大项目要大预算。在顶会发表 **{{rule.papersRequired}} 篇论文** 才能毕业。**引用数**（右上角）积累你的声望，提高录用率、吓退抢发者。别让 **希望值** 归零。**审稿人二号有时真的很狠。**"
ui.aboutButton: 关于
ui.aboutTitle: 关于
ui.aboutContent: "**AI 博士模拟器**——一款文字模拟游戏，体验机器学习博士生的日常：arXiv、算力预算、真实会议截稿、审稿人二号、rebuttal、引用、被抢发和 burnout。改编自 Mianzhi Wang 的原作 **PhD Simulator**（MIT 许可证）。支持中英双语，可在页脚切换。"
ui.seedButton: 随机种子
ui.seedTitle: 随机种子

# 引用
# ---------------------------------------------------------------------------
message.wellCitedNow: 你的论文引用数破了 **50**。大家开始把你当作 baseline 来引——审稿人认得这条线的工作，你的录用率也跟着涨了一点。
message.influentialNow: 你的引用数破了 **200**，还收到了第一个 **invited talk** 邀请。你已经是领域里立得住的名字了——录用更容易，心态也更稳。
message.paperCited: 你的一篇论文引用量在涨（X 上也多了几个关注者）。你感到被认可了。

# ---------------------------------------------------------------------------
# 被抢发
# ---------------------------------------------------------------------------
message.ideaDoneByOthers: 你一觉醒来，发现一篇 **arXiv 预印本** 做的正是你的想法。被抢发了。这个想法没法继续了。
message.prelimDoneByOthers: 一个算力是你十倍的实验室刚把你的初步结果挂上了 arXiv。又被抢发了。
message.goodIdea: 导师觉得这个想法确实很有前途。你受到了鼓舞。
message.figureInvalid: 重新检查 eval 脚本时，你发现一个 bug 让其中一张图作废了。这个实验得重跑。

# ---------------------------------------------------------------------------
# 显卡集群 / 基础设施
# ---------------------------------------------------------------------------
message.equipmentBroken: 显卡集群宕机了——一个机柜过热，调度器没响应。
message.doNothing: 干等着。
message.cannotUseEquipment: 集群恢复之前你跑不了任何实验。太难受了。
message.fixEquipment: 自己动手 debug。
message.contactEquipmentSupport: 给运维提工单。
message.equipmentFixed: 你找到了挂掉的节点、把它 drain 掉并重新提交了任务。搞定！感谢 SLURM。
message.equipmentNotFixed: 你折腾了好几个小时，队列还是卡着不动。
message.equipmentFixedByTechSupport: 运维重启了机柜，你的任务又跑起来了。
message.equipmentNotFixedByTechSupport: 运维在处理了，但问题比预想的更深，还得再修一阵子。
message.newEquipment: 导师给实验室买了一台崭新的 **H100 节点**。每月算力更多，实验也更容易成功。
message.cloudStorage: "实验室公告：组里配置了到云存储的 **自动 checkpoint**。你的 run 现在安全了。"

# ---------------------------------------------------------------------------
# 会议出差
# ---------------------------------------------------------------------------
message.attendConf: 你去开会、做了报告、认识了一大堆人。来看看明天的日程安排。
message.skipConfSession: 翘掉会议，去逛逛这座城市。
message.confNiceTour1: 这座城市美极了，散完步回来你元气满满。
message.confNiceTour2: 你发现了一家很棒的小馆子，吃得相当满足。
message.skipConfSessionFail1: 翘会的时候你撞见了导师。尴尬。
message.skipConfSessionFail2: 导师在实验室的海报前找你，结果没找到。
message.attendConfSession: 去听报告，在 poster session 上社交。
message.confNewIdea: 你听了一个很赞的报告，会后在海报前一聊，蹦出了 **一个新想法**——还多了几个引用。
message.confNoNewIdea: 报告很精彩，晚宴更精彩，还有几个人告诉你他们在引用你的工作。

# ---------------------------------------------------------------------------
# 导师提醒
# ---------------------------------------------------------------------------
message.tooManyIdeas: 导师发邮件：「你点子够多了——现在请把其中一个做成真正的结果。」
message.notEnoughPapers: 导师催你的发表数量，显然急着想看到更多录用的论文。
message.rejectedPaperAdvisor: 导师就这次拒稿给你发消息：「别被审稿人二号影响。冷静一下、回应意见、改投。」

# ---------------------------------------------------------------------------
# Rebuttal 阶段
# ---------------------------------------------------------------------------
message.rebuttalPeriod: 审稿意见出来了，**rebuttal 阶段** 开始了。分数有高有低。你要花一周写 rebuttal 吗？
message.writeRebuttal: 写一份有数据支撑的强力 rebuttal。
message.rebuttalWritten: 你补做了审稿人想要的额外实验，写了一份逐条回应、干净利落的 rebuttal。录用概率暂时 **提升**。
message.skipRebuttal: 算了——分数不会动的。
message.rebuttalSkipped: 你觉得结局已定，放弃了写 rebuttal。

# ---------------------------------------------------------------------------
# 实习
# ---------------------------------------------------------------------------
message.applyInternship: 投暑期实习。
message.noInternOffer: 你刷了好几周的算法面和 take-home——这一轮还是没拿到 offer。这个月白费了。攒攒履历再战吧。
message.recruiterReachout: "一位 recruiter 直接给你发了邮件（也许是你导师打了招呼）：你的论文被一家顶级实验室看上了，他们给你一个 **研究实习** offer——算力管够，还能发论文。接吗？"
message.acceptInternship: 接受实习。
message.declineInternship: 拒绝——留下来专注毕业论文。
message.internshipDeclined: 你婉拒了邀请，留下来专注自己的研究。导师对你的投入感到很欣慰。
message.internFrontierLab1: 你在 **DeepKind** 实习。几乎无限的 TPU、顶尖的 mentor，还发了一篇论文。回来时你带着大把算力额度、引用和一封厚厚的推荐信。
message.internFrontierLab2: 在 **OpenAEye** 的前沿团队过了一个夏天。你上手了一个比你整个系的集群还大的模型——还能发论文。声望直接拉满。
message.internBigTechResearch1: 你在 **狗家（Goggle）Brain** 实习。真正的研究岗：算力充足、合作者聪明，项目还能发表。
message.internBigTechResearch2: 在 **脸谱（Faceplant）AI 研究院** 做研究实习。卡管够，还收获了一篇论文。
message.internProduct1: 你在 **香蕉（Banana）** 的产品团队实习。薪水高、算力也还行——但这是个签了 NDA 的产品岗，**不能发论文**。导师不太高兴。
message.internProduct2: 在 **亚麻（Amazoom）** 做产品实习。钱不少，上线了一个面向千万用户的功能——但没有任何能挂 arXiv 的东西。
message.internGpuRich1: 你在 **黄狗（NWidia）** 实习。他们扔给你 **一座 GPU 山**，说「随便跑」。算力管到饱。
message.internGpuRich2: 在 **字节（ByteDunce）** 过了一个夏天。离谱的算力量、节奏飞快的团队；回来时你算力满满。
message.internStartup1: 你去一家干劲十足的创业公司 **Mythral** 实习了一个夏天。集群很小，但迭代飞快——你上手很快，学到一堆东西。
message.internStartup2: 在 **Unicorn.ai** 实习。快速迭代、快速「炼崩」。算力不多，但收获了一堆新点子。


message.courseworkNotice: "院系提示：前两年有必修 **课程**。上课和作业会时不时占用你的科研时间——没有高压的博资考，只是前期少了些泡实验室的时间。"
message.coursework1: 期中周。习题集和一份课程报告吃掉了你这个月的科研时间。
message.coursework2: 这个月你忙着当助教、赶课程项目，几乎没空做自己的研究。
message.coursework3: 繁重的课业（外加一场期末考）让你这个月没怎么进实验室。
message.courseworkIdea: ML 理论课上的一节课居然给了你一个研究灵感。这个月的课也不算全白上。

# ---------------------------------------------------------------------------
# Burnout
# ---------------------------------------------------------------------------
message.exhaustion: 连续几个月赶 ddl、凌晨三点盯着 training run，你开始 burnout，怎么都集中不了精神。
message.exhaustionBreak: 导师注意到你最近状态很差，给你发了一篇关于可持续科研和工作生活平衡的文章。
message.takeBreak: 跟导师请几天假。
message.recoveredAfterBreak: 导师批了假。你退出 Slack、好好睡了几觉，回来后 **满血复活**。
message.noBreak: 我没事，真的。
message.exhaustionIgnored: 你告诉自己 ddl 更重要，继续埋头肝。
message.exhaustionBadMonth: 你盯着 loss 曲线看了好几个小时，啥也没看进去。脑子已经烧干，得真正休息一下了。
message.exhaustionNoProgress: 你逼自己继续写代码，但没什么用。这个月毫无进展。

# ---------------------------------------------------------------------------
# 高年级焦虑
# ---------------------------------------------------------------------------
message.lateYearAnxiety: 已经第三年了。你看着一届又一届师兄师姐答辩离开，开始担心自己能不能按时毕业。

# ---------------------------------------------------------------------------
# 算力 / 经费
# ---------------------------------------------------------------------------
message.computeStarved: 你的 GPU 配额快用光了。在算力预算回血之前，大实验先别想了（经费越多、集群越好，算力回得越快）。
message.fundingRises: "AI 新闻：大批新基金和企业捐赠涌入 ML 实验室。一位项目主管宣称：「算力就是新时代的石油。」"
message.fundingFalls: "AI 新闻：显卡价格暴涨，本财年多项经费被冻结。各实验室的算力预算恐将收紧。"
message.moreFunding: 导师拿到了一个新基金（外加一大笔云算力额度）。你每月的算力预算涨了。
message.lessFunding: 导师的经费续期卡住了。实验室开始悄悄地限制 GPU 时长。
message.lostFunding: 一笔云账单到期，某个项目的 **算力预算被砍**。实验室人心惶惶。

# ---------------------------------------------------------------------------
# 导师不满
# ---------------------------------------------------------------------------
message.unhappyAdvisor: 导师对你最近的进展不太满意。「科研很难，但我希望看到你更有冲劲一点。」
message.advisorHappyAgain: 导师对你最近的进展看起来很满意。

# ---------------------------------------------------------------------------
# 主线流程
# ---------------------------------------------------------------------------
message.beginning: 恭喜——你被一所顶尖 AI 博士项目 **录取** 了。接受这个 offer 吗？
message.acceptOffer: 接受 offer。
message.acceptedOffer: 你接受了 offer 并加入了一个实验室。要毕业，你必须在顶级会议（ICLR、ICML、NeurIPS、CVPR）上至少发表 **{{rule.papersRequired}} 篇论文**。你起步只有一点 **GPU 预算**——省着点花。
message.declineOffer: 拒绝，去大厂工作。
message.declinedOffer: 你拒绝了 offer，转而接了一份高薪的研究工程师岗位。也许这才是更明智的时间线。
message.newMonth: 新的一个月开始了。来看看待办清单。
message.readPapers: 刷 arXiv 读论文。
message.gainNewIdea1: 刷了一堆 arXiv 摘要后，一个 **新研究想法** 突然冒了出来。
message.gainNewIdea2: 盯着某篇论文的相关工作看了几个小时，你发现了一个空白，得到了 **一个新想法**。
message.workOnIdea: 跑个小实验（−1 算力）。
message.oldIdea1: 你把想法讲给导师听，导师翻出一篇 2019 年的论文——人家早就做过一模一样的了。
message.oldIdea2: 导师觉得这个想法太 incremental，让你想得更大一点。
message.oldIdea3: 导师觉得新意不够，让你再多读读近期文献。
message.oldIdea4: 你灵感爆发想了一堆点子——结果在 Semantic Scholar 上一搜，每一个都已经有人发过了。
message.noIdea1: 你开了 60 个 arXiv 标签页，浏览器直接 **崩溃** 了。你彻底忘了自己刚才在读什么。
message.gainPrelimResult: 这个想法在小数据集上出信号了！你有了一个 **小规模结果**。
message.ideaNotWorking: 这个想法没跑出花来——和 baseline 没区别。换下一个吧。
message.workOnPrelimResult: 扩展小规模结果（−3 算力）。
message.gainMajorResult: 它 scale 上去了！你超过了强基线，拿到了一个 **SOTA 结果**。
message.noMajorResult1: 你确信这里面有真东西，但一上规模训练就发散。还得再花点时间。
message.noMajorResult2: 导师发现了一个数据泄露的 bug，把你的指标都刷高了。回炉重造吧。
message.trainLargeModel: 训练大模型（−8 算力，高影响力）。
message.largeModelSuccess: 你砸了一大笔算力跑了个大规模实验——结果 **效果炸裂**。一个轰动的 SOTA 结果、一张惊艳的图，社区已经开始讨论了。
message.largeModelFail: 大规模实验跑到一半 **发散** 了（先 NaN loss，再 OOM）。你白白烧掉了一大笔 GPU 机时。
message.workOnFigure: 跑消融 / 画图（−2 算力）。
message.gainFigure: 消融干净又有说服力。你做出了一张漂亮的 **图**。
message.noFigure1: 结果噪声很大、不够显著。你需要更多随机种子和更多算力。
message.noFigure2: 你的任务 **CUDA out of memory**，在第 47 个 epoch 挂了。得用 gradient checkpointing 重跑。
message.noFigure3: 训练比预期慢得多；结果还没出来。
message.noFigure4: 一次依赖升级把环境搞崩了。你花了好几天对齐 CUDA / PyTorch 版本，还得再要点时间。
message.lostData: 一个节点跑到一半崩了，checkpoint 全没了。实验只能重跑。
message.lostDataRecovered: 一个节点跑到一半崩了——但自动存档从云端 **恢复** 了一切，你顺利拿到了 **图**。
message.wrongFigure: 你的几个数字互相矛盾，eval 里肯定有 bug。得花时间排查。
message.workOnPaper: 写论文。
message.draftPaperComplete: 你写完了 **初稿**。万事俱备——等下一个会议截稿点来了就投出去。
message.draftPaperIncomplete1: 导师这一轮太忙，没来得及看你的稿子。
message.draftPaperIncomplete2: 尽管你很努力，相关工作部分还得再补。没写完。
message.draftPaperIncomplete3: 尽管你很努力，实验部分还需要更多分析。没写完。
message.draftPaperIncomplete4: 你整个月都在和 LaTeX 的图片排版以及 9 页篇幅限制搏斗。还是没写完。
message.draftPaperIncomplete5: 还有几个小节只写了一半。快了快了。
message.draftPaperIncomplete6: 导师看完初稿，要求把摘要和引言彻底重写。
message.draftPaperIncomplete7: 导师指出好几张图不够有说服力。你得再花时间改。
message.postPreprint: 在 arXiv 上挂预印本。
message.preprintPosted: 你把工作挂上了 **arXiv**，在别人抢发之前先插旗占坑。它开始积累早期引用，你的名字也传开了。
message.revisePaper: 把被拒论文改成新的初稿。
message.revisionComplete: 你逐条回应了审稿意见、补了人家要的实验，把拒稿打磨成了一份崭新的 **初稿**，可以瞄准下一个截稿点了。


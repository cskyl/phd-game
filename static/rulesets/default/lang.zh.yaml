item.figure.description: 一张经得起推敲的干净图表或消融。凑齐 {{rule.figuresRequired}} 张并配上 SOTA 结果，就能起草论文。
item.paperDraft: 论文初稿
item.paperDraft.description: 一份写好的、可以投出去的稿子。等下一个会议截稿点（ICLR / ICML / NeurIPS / CVPR）来了再投。

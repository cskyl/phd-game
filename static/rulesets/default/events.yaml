# Rebuttal: applies while any paper is under review.
- id: RebuttalPeriod
  trigger: MonthBegin
  probability: 0.5
  conditions:
  - id: Expression
    expression: (itemCount('submittedICLR') + itemCount('submittedICML') + itemCount('submittedNeurIPS') + itemCount('submittedCVPR')) >= 1 && !hasStatus('strongRebuttal')
  actions:
  - id: DisplayChoices
    message: message.rebuttalPeriod
    choices:
    - message: message.writeRebuttal
      actions:
      - id: DisplayMessage
        message: message.rebuttalWritten
        confirm: message.hope
      - id: SetStatus
        statusId: strongRebuttal
        on: true
      - id: UpdateVariables
        updates:
          player.exhaustionLevel: player.exhaustionLevel + 1
          player.hope: player.hope - 2
    - message: message.rebuttalExperiment
      requirement: player.compute >= 4
      actions:
      - id: DisplayMessage
        message: message.rebuttalExperimentDone
        confirm: message.hope
      - id: SetStatus
        statusId: strongRebuttal
        on: true
      - id: UpdateVariables
        updates:
          player.compute: player.compute - 4
          player.pubWeight: player.pubWeight + 1
          player.citations: player.citations + randi(4) + 1
          player.exhaustionLevel: player.exhaustionLevel + 1
    - message: message.skipRebuttal
      actions:
      - id: DisplayMessage
        message: message.rebuttalSkipped
        confirm: message.ok
# ===========================================================================
# Getting scooped (reduced by preprints and reputation)
# ===========================================================================
- id: IdeaDoneByOthers
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: itemCount('idea') >= 1
  probability: max(0.02, (0.18 - hasStatus('preprinted') * 0.07 - min(player.pubWeight * 0.01, 0.07)) * player.scoopMod)
  actions:
  - id: DisplayMessage
    message: message.ideaDoneByOthers
    confirm: message.unfortunate
  - id: GiveItem
    itemId: idea
    amount: -1
  - id: UpdateVariable
    variable: player.hope
    value: player.hope - 5
- id: PrelimDoneByOthers
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: itemCount('preliminaryResult') >= 1
  probability: max(0.02, (0.07 - hasStatus('preprinted') * 0.03) * player.scoopMod)
  actions:
  - id: DisplayMessage
    message: message.prelimDoneByOthers
    confirm: message.unfortunate
  - id: GiveItem
    itemId: preliminaryResult
    amount: -1
  - id: UpdateVariable
    variable: player.hope
    value: player.hope - 6
- id: FigureInvalid
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: itemCount('figure') >= 3
  actions:
  - id: CoinFlip
    probability: clip(0.1 - itemCount('paper') / 30, 0, 1)
    success:
    - id: DisplayMessage
      message: message.figureInvalid
      confirm: message.oops
    - id: GiveItem
      itemId: figure
      amount: -1
    - id: UpdateVariable
      variable: player.hope
      value: player.hope - 5

---
- id: Init
  trigger: Initialization
  once: true
  actions:
  - id: UpdateVariableLimits
    updates:
      player.hope: [0, 100]
      player.compute: [0, 99]
  - id: UpdateVariables
    updates:
      elapsedMonth: 0
      month: 1
      year: 1
      player.hope: 50
      # GPU compute is a MONTHLY CAPACITY (a rate), reset every month — you
      # cannot bank unused compute. `computeBase` is your lab's allocation
      # (set by your advisor); `compute` is what's left to spend this month.
      player.computeBase: 6
      player.compute: 6
      # total citations accumulated by your published & preprinted work
      player.citations: 0
      # reputation / impact stock; drives citation growth and acceptance odds
      player.pubWeight: 0
      # subfield modifiers (set when you pick a research area)
      player.scoopMod: 1
      player.citeVelocity: 1
      player.subfield: 0
      # advisor/career signals
      player.letterStrength: 1
      player.serviceRep: 0
      # derived display stats
      player.paperCount: 0
      player.hindex: 0
      # internship tracking (drives the final placement)
      player.internCount: 0
      player.researchIntern: 0
      player.bigTechIntern: 0
      # set to 1 when you decide (or are pushed) to graduate
      player.graduating: 0
      # scratch variables used to compute the final placement / report card
      player.finalScore: 0
      player.finalPapers: 0
      player.readPapers: 0
      player.monthSkipped: 0
      player.exhaustionLevel: 0
      advisor.fundingLevel: 0
      advisor.happiness: randi(5) + 5
      global.fundingChange: 0
      rule.papersRequired: 4
      rule.figuresRequired: 2
  - id: SetStatus
    statusId: firstYear
    on: true
# Game tick loop
- id: GameTick
  trigger: Tick
  actions:
  - id: UpdateVariables
    updates:
      elapsedMonth: elapsedMonth + 1
      month: ((elapsedMonth - 1) % 12) + 1
      year: floor((elapsedMonth - 1) / 12) + 1
  - id: Switch
    branches:
    - condition: elapsedMonth % 12 === 1
      actions:
      - id: TriggerEvents
        triggers:
        - id: YearBegin
          priority: 1
  - id: TriggerEvents
    triggers:
    - id: MonthBegin
- id: TheBeginning
  trigger: MonthBegin
  once: true
  actions:
  - id: DisplayChoices
    message: message.beginning
    choices:
    - message: message.acceptOffer
      actions:
      - id: DisplayMessage
        message: message.acceptedOffer
        confirm: message.excited
      # --- Difficulty ---
      - id: DisplayChoices
        message: message.chooseDifficulty
        choices:
        - message: message.diffEasy
          actions:
          - id: UpdateVariable
            variable: rule.papersRequired
            value: 3
        - message: message.diffNormal
          actions:
          - id: UpdateVariable
            variable: rule.papersRequired
            value: 4
        - message: message.diffHard
          actions:
          - id: UpdateVariables
            updates:
              rule.papersRequired: 6
              player.scoopMod: 1.3
      # --- Advisor archetype ---
      - id: DisplayChoices
        message: message.chooseAdvisor
        choices:
        - message: message.advisorFamous
          actions:
          - id: DisplayMessage
            message: message.advisorFamousPicked
            confirm: message.excited
          - id: UpdateVariables
            updates:
              player.computeBase: 9
              advisor.fundingLevel: 1
              player.letterStrength: 2
        - message: message.advisorJunior
          actions:
          - id: DisplayMessage
            message: message.advisorJuniorPicked
            confirm: message.excited
          - id: UpdateVariables
            updates:
              player.computeBase: 4
              player.letterStrength: 1
              player.hope: player.hope + 5
        - message: message.advisorBalanced
          actions:
          - id: DisplayMessage
            message: message.advisorBalancedPicked
            confirm: message.ok
          - id: UpdateVariables
            updates:
              player.computeBase: 5
              player.letterStrength: 1.5
      # --- Research subfield ---
      - id: DisplayChoices
        message: message.chooseSubfield
        choices:
        - message: message.subLLM
          actions:
          - id: DisplayMessage
            message: message.subLLMPicked
            confirm: message.excited
          - id: UpdateVariables
            updates:
              player.subfield: 1
              player.scoopMod: player.scoopMod * 1.4
              player.citeVelocity: 1.5
              player.computeBase: player.computeBase - 2
        - message: message.subCV
          actions:
          - id: DisplayMessage
            message: message.subCVPicked
            confirm: message.cool
          - id: UpdateVariables
            updates:
              player.subfield: 2
              player.scoopMod: player.scoopMod * 1.2
              player.citeVelocity: 1.2
        - message: message.subRL
          actions:
          - id: DisplayMessage
            message: message.subRLPicked
            confirm: message.ok
          - id: UpdateVariable
            variable: player.subfield
            value: 3
        - message: message.subTheory
          actions:
          - id: DisplayMessage
            message: message.subTheoryPicked
            confirm: message.ok
          - id: UpdateVariables
            updates:
              player.subfield: 4
              player.scoopMod: player.scoopMod * 0.5
              player.citeVelocity: 0.6
              player.computeBase: player.computeBase + 2
        - message: message.subSystems
          actions:
          - id: DisplayMessage
            message: message.subSystemsPicked
            confirm: message.ok
          - id: UpdateVariables
            updates:
              player.subfield: 5
              player.scoopMod: player.scoopMod * 0.9
              player.citeVelocity: 0.9
              player.computeBase: player.computeBase + 1
      - id: DisplayMessage
        message: message.courseworkNotice
        confirm: message.ok
    - message: message.declineOffer
      actions:
      - id: EndGame
        message: message.declinedOffer
        confirm: message.restartNewTimeline
        winning: true
    confirm: message.excited
# Monthly upkeep: hope drift + compute regeneration.
- id: CommonVariableUpdates
  trigger: MonthBegin
  actions:
  - id: UpdateVariables
    updates:
      player.hope: player.hope + getAttributeValue('player.hopeBoost')
      player.monthSkipped: 0
      # GPU capacity RESETS every month (use-it-or-lose-it): lab allocation +
      # funding + hardware/credits/fellowship (attribute) + seniority.
      player.compute: clip(player.computeBase + advisor.fundingLevel + getAttributeValue('player.computeBoost') + floor(year / 2), 0, 99)
      # derived stats for the meters / report card
      player.paperCount: itemCount('paper')
      player.hindex: min(itemCount('paper'), floor(player.citations / 12))
- id: LostAllHope
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: player.hope <= 0
  actions:
  - id: EndGame
    message: message.lostAllHope
    confirm: message.restart
    winning: false
- id: Overdue
  trigger: YearBegin
  conditions:
  - id: Expression
    expression: year >= 8
  actions:
  - id: EndGame
    message: message.overdue
    confirm: message.restart
    winning: false
# ===========================================================================
# Citation system
# ===========================================================================
# Citations accrue every month, scaled by your reputation (pubWeight).
# Monthly citation drift is noisy: scales with your IMPACT stock (pubWeight,
# which is itself a heavy-tailed lottery per paper), and some months yield
# nothing at all. Low-impact work barely moves; hits keep compounding.
- id: CitationGrowth
  trigger: MonthBegin
  probability: 0.7
  conditions:
  - id: Expression
    expression: player.pubWeight > 0
  actions:
  - id: UpdateVariable
    variable: player.citations
    value: player.citations + round(player.pubWeight * player.citeVelocity * random() * 1.5)
# A paper's citation fate is a heavy-tailed lottery rolled on acceptance: most
# sink with almost nothing, a few take off. pubWeight (impact stock) only grows
# for papers that land, so duds never generate ongoing citations.
# Rolled on acceptance: the decision level (poster / spotlight / oral) and the
# citation payoff, which scales with the level. Even within a level it's a
# lottery — many posters are barely cited (pubWeight += 0), a rare oral makes
# your name. pubWeight (impact stock) only grows for papers that land.
- id: PaperFate
  trigger: PaperFate
  actions:
  - id: Random
    groups:
    # Poster — the common case. Many posters sink with almost no citations.
    - weight: 70
      actions:
      - id: DisplayMessage
        message: message.acceptedPoster
        confirm: message.ok
      - id: UpdateVariables
        updates:
          player.citations: player.citations + randi(8)
          player.pubWeight: player.pubWeight + randi(2)
    # Spotlight — highlighted, decent visibility.
    - weight: 22
      actions:
      - id: DisplayMessage
        message: message.acceptedSpotlight
        confirm: message.great
      - id: UpdateVariables
        updates:
          player.citations: player.citations + randi(15) + 5
          player.pubWeight: player.pubWeight + randi(2) + 1
    # Oral — rare, top of the program, makes your reputation.
    - weight: 8
      actions:
      - id: DisplayMessage
        message: message.acceptedOral
        confirm: message.party
      - id: UpdateVariables
        updates:
          player.citations: player.citations + randi(30) + 15
          player.pubWeight: player.pubWeight + randi(3) + 2
- id: WellCitedMilestone
  trigger: MonthBegin
  once: true
  conditions:
  - id: Expression
    expression: player.citations >= 50
  actions:
  - id: DisplayMessage
    message: message.wellCitedNow
    confirm: message.great
  - id: SetStatus
    statusId: wellCited
    on: true
  - id: UpdateVariable
    variable: player.hope
    value: player.hope + 5
- id: InfluentialMilestone
  trigger: MonthBegin
  once: true
  conditions:
  - id: Expression
    expression: player.citations >= 200
  actions:
  - id: DisplayMessage
    message: message.influentialNow
    confirm: message.party
  - id: SetStatus
    statusId: influential
    on: true
  - id: SetStatus
    statusId: wellCited
    on: false
  - id: UpdateVariables
    updates:
      player.hope: player.hope + 8
      advisor.happiness: advisor.happiness + 3
# Compute crunch tutorial nudge (shows once when you are starved of GPUs).
- id: ComputeCrunch
  trigger: MonthBegin
  once: true
  probability: 0.6
  conditions:
  - id: Expression
    expression: player.compute < 2 && (itemCount('preliminaryResult') > 0 || itemCount('majorResult') > 0)
  actions:
  - id: DisplayMessage
    message: message.computeStarved
    confirm: message.gotit
# GPU cluster outage
- id: EquipmentBroken
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: (month >= 4 || year > 1) && !hasStatus('brokenEquipment')
  probability: 0.04
  actions:
  - id: DisplayChoices
    message: message.equipmentBroken
    choices:
    - message: message.doNothing
      actions:
      - id: DisplayMessage
        message: message.cannotUseEquipment
        confirm: message.ok
      - id: UpdateVariables
        updates:
          player.hope: player.hope - 5
      - id: SetStatus
        statusId: brokenEquipment
        on: true
    - message: message.fixEquipment
      actions:
      - id: Random
        groups:
        - weight: 0.4
          actions:
          - id: DisplayMessage
            message: message.equipmentFixed
            confirm: message.great
          - id: UpdateVariable
            variable: player.hope
            value: player.hope + 3
        - weight: 0.6
          actions:
          - id: DisplayMessage
            message: message.equipmentNotFixed
            confirm: message.unfortunate
          - id: SetStatus
            statusId: brokenEquipment
            on: true
    - message: message.contactEquipmentSupport
      actions:
      - id: Random
        groups:
        - weight: 0.7
          actions:
          - id: DisplayMessage
            message: message.equipmentFixedByTechSupport
            confirm: message.great
        - weight: 0.3
          actions:
          - id: DisplayMessage
            message: message.equipmentNotFixedByTechSupport
            confirm: message.unfortunate
          - id: SetStatus
            statusId: brokenEquipment
            on: true
- id: EquipmentUpgrade
  trigger: MonthBegin
  once: true
  probability: 0.08
  conditions:
  - id: Expression
    expression: year >= 2 && advisor.fundingLevel >= 1
  actions:
  - id: DisplayMessage
    message: message.newEquipment
    confirm: message.cool
  - id: SetStatus
    statusId: upgradedEquipment
    on: true
  - id: SetStatus
    statusId: brokenEquipment
    on: false
- id: CloudStorage
  trigger: YearBegin
  once: true
  probability: 0.3
  conditions:
  - id: Expression
    expression: year >= 2
  actions:
  - id: DisplayMessage
    message: message.cloudStorage
    confirm: message.cool
  - id: SetStatus
    statusId: cloudStorage
    on: true
# Burnout
- id: Exhaustion
  trigger: MonthBegin
  probability: 0.7
  conditions:
  - id: Expression
    expression: "!hasStatus('exhaustion') && player.exhaustionLevel >= 12"
  actions:
  - id: DisplayMessage
    message: message.exhaustion
    confirm: message.sucks
  - id: SetStatus
    statusId: exhaustion
    on: true
- id: ExhaustionBreak
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: hasStatus('exhaustion')
  probability: 0.5
  actions:
  - id: DisplayChoices
    message: message.exhaustionBreak
    choices:
    - message: message.takeBreak
      actions:
      - id: DisplayMessage
        message: message.recoveredAfterBreak
        confirm: message.great
      - id: UpdateVariables
        updates:
          player.exhaustionLevel: 0
          player.monthSkipped: 1
          player.hope: player.hope + 5
      - id: SetStatus
        statusId: exhaustion
        on: false
    - message: message.noBreak
      actions:
      - id: DisplayMessage
        message: message.exhaustionIgnored
        confirm: message.ok
- id: ExhaustionBadMonth
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: player.exhaustionLevel >= 14
  probability: 0.2 + player.exhaustionLevel / 50
  actions:
  - id: UpdateVariable
    variable: player.monthSkipped
    value: 1
  - id: DisplayChoices
    message: message.exhaustionBadMonth
    choices:
    - message: message.takeBreak
      actions:
      - id: DisplayMessage
        message: message.recoveredAfterBreak
        confirm: message.great
      - id: UpdateVariables
        updates:
          player.exhaustionLevel: 0
          player.hope: player.hope + 5
      - id: SetStatus
        statusId: exhaustion
        on: false
    - message: message.noBreak
      actions:
      - id: DisplayMessage
        message: message.exhaustionNoProgress
        confirm: message.ok
      - id: UpdateVariable
        variable: player.hope
        value: player.hope - 5
- id: LateYearAnxiety
  trigger: YearBegin
  once: true
  conditions:
  - id: Expression
    expression: year >= 4
  actions:
  - id: DisplayMessage
    message: message.lateYearAnxiety
    confirm: message.ok
  - id: SetStatus
    statusId: lateYearAnxiety
    on: true
# ===========================================================================
# Compute budget / funding
# ===========================================================================
- id: FundingChange
  trigger: YearBegin
  conditions:
  - id: Expression
    expression: eventOccurred('FundingNews')
  probability: 0.5
  once: true
  actions:
  - id: Switch
    branches:
    - condition: global.fundingChange > 0
      actions:
      - id: DisplayMessage
        message: message.moreFunding
        confirm: message.great
      - id: UpdateVariables
        updates:
          advisor.fundingLevel: advisor.fundingLevel + global.fundingChange
          player.hope: player.hope + 5
    - condition: global.fundingChange < 0
      actions:
      - id: DisplayMessage
        message: message.lessFunding
        confirm: message.sucks
      - id: UpdateVariables
        updates:
          advisor.fundingLevel: advisor.fundingLevel + global.fundingChange
          player.hope: player.hope - 5
- id: FundingCut
  trigger: MonthBegin
  probability: 0.2
  once: true
  conditions:
  - id: Expression
    expression: eventOccurred('FundingChange') && advisor.fundingLevel < 0 && month % 3 === 0
  actions:
  - id: DisplayMessage
    message: message.lostFunding
    confirm: message.sucks
  - id: UpdateVariables
    updates:
      player.hope: player.hope - 5
- id: FundingNews
  trigger: YearBegin
  conditions:
  - id: Expression
    expression: year >= 2
  probability: 0.5
  once: true
  actions:
  - id: CoinFlip
    probability: 0.5
    success:
    - id: DisplayMessage
      message: message.fundingRises
      confirm: message.great
    - id: UpdateVariable
      variable: global.fundingChange
      value: 1
    fail:
    - id: DisplayMessage
      message: message.fundingFalls
      confirm: message.shame
    - id: UpdateVariable
      variable: global.fundingChange
      value: -1
# Unhappy advisor
- id: UnhappyAdvisor
  trigger: MonthBegin
  actions:
  - id: Switch
    branches:
    - condition: advisor.happiness < 0 && !hasStatus('unhappyAdvisor')
      actions:
      - id: DisplayMessage
        message: message.unhappyAdvisor
        confirm: message.gotit
      - id: SetStatus
        statusId: unhappyAdvisor
        on: true
    - condition: advisor.happiness >= 0 && hasStatus('unhappyAdvisor')
      actions:
      - id: DisplayMessage
        message: message.advisorHappyAgain
        confirm: message.cool
      - id: SetStatus
        statusId: unhappyAdvisor
        on: false
# First-two-years coursework: occasionally eats a month of research time.
- id: Coursework
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: year <= 2 && player.monthSkipped === 0
  probability: 0.25
  actions:
  - id: UpdateVariable
    variable: player.monthSkipped
    value: 1
  - id: Random
    groups:
    - weight: 2
      actions:
      - id: DisplayRandomMessage
        messages:
        - message.coursework1
        - message.coursework2
        - message.coursework3
        confirm: message.ok
    - weight: 1
      actions:
      - id: DisplayMessage
        message: message.courseworkIdea
        confirm: message.soundsInteresting
      - id: GiveItem
        itemId: idea
        amount: 1
# TA / funding duty: eats a month of research time (heavier in early years).
- id: TADuty
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: year <= 4 && player.monthSkipped === 0 && itemCount('paper') < rule.papersRequired
  probability: 0.12
  actions:
  - id: UpdateVariable
    variable: player.monthSkipped
    value: 1
  - id: DisplayRandomMessage
    messages:
    - message.taDuty1
    - message.taDuty2
    confirm: message.ok
# ===========================================================================
# Main monthly action menu
# Pipeline: read -> idea -> (compute) experiment -> prelim
#           -> (compute) scale-up / train-large-model -> SOTA result
#           -> (compute) ablations -> figures -> write -> draft
#           -> submit at a real conference deadline -> review -> paper
# ===========================================================================
- id: MonthBeginTasks
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: player.monthSkipped === 0
  actions:
  - id: DisplayChoices
    message: message.newMonth
    choices:
    - message: message.workOnThesis
      requirement: itemCount('paper') >= rule.papersRequired
      actions:
        - id: DisplayMessage
          message: message.decideToGraduate
          confirm: message.excited
        - id: UpdateVariable
          variable: player.graduating
          value: 1
    - message: message.readPapers
      requirement: itemCount('paper') < rule.papersRequired
      actions:
      - id: UpdateVariable
        variable: player.readPapers
        value: player.readPapers + 1
      - id: CoinFlip
        probability: 0.60 + player.readPapers / 100 - itemCount('idea') / 20
        success:
        - id: GiveItem
          itemId: idea
          amount: 1
        - id: DisplayRandomMessage
          messages:
          - message.gainNewIdea1
          - message.gainNewIdea2
          confirm: message.great
        - id: CoinFlip
          probability: 0.2
          success:
          - id: DisplayMessage
            message: message.goodIdea
            confirm: message.encouraging
          - id: UpdateVariables
            updates:
              player.hope: player.hope + 2
        fail:
        - id: DisplayRandomMessage
          messages:
          - message.oldIdea1
          - message.oldIdea2
          - message.oldIdea3
          - message.oldIdea4
          - message.noIdea1
          confirm: message.oops
        - id: UpdateVariable
          variable: player.hope
          value: player.hope - 5
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.workOnIdea
      requirement: itemCount('idea') > 0 && player.compute >= 1 && itemCount('paper') < rule.papersRequired
      actions:
      - id: GiveItem
        itemId: idea
        amount: -1
      - id: UpdateVariable
        variable: player.compute
        value: player.compute - 1
      - id: CoinFlip
        probability: min(0.65 + player.readPapers / 50, 0.9)
        success:
        - id: DisplayMessage
          message: message.gainPrelimResult
          confirm: message.soundsInteresting
        - id: GiveItem
          itemId: preliminaryResult
          amount: 1
        - id: UpdateVariable
          variable: player.hope
          value: player.hope + 2
        fail:
        - id: DisplayMessage
          message: message.ideaNotWorking
          confirm: message.unfortunate
        - id: UpdateVariable
          variable: player.hope
          value: player.hope - 5
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.workOnPrelimResult
      requirement: itemCount('preliminaryResult') > 0 && player.compute >= 3 && itemCount('paper') < rule.papersRequired
      actions:
      - id: UpdateVariable
        variable: player.compute
        value: player.compute - 3
      - id: Random
        groups:
        - weight: 0.65
          actions:
          - id: DisplayMessage
            message: message.gainMajorResult
            confirm: message.soundsInteresting
          - id: UpdateItemAmounts
            updates:
              majorResult: 1
              preliminaryResult: -1
          - id: UpdateVariable
            variable: player.hope
            value: player.hope + 5
        - weight: 0.35
          actions:
          - id: DisplayRandomMessage
            messages:
            - message.noMajorResult1
            - message.noMajorResult2
            confirm: message.unfortunate
          - id: UpdateVariable
            variable: player.hope
            value: player.hope - 5
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.trainLargeModel
      requirement: itemCount('preliminaryResult') > 0 && player.compute >= 10 && !hasStatus('brokenEquipment') && itemCount('paper') < rule.papersRequired
      actions:
      - id: UpdateVariable
        variable: player.compute
        value: player.compute - 10
      - id: CoinFlip
        probability: min(0.65 + getAttributeValue('player.experimentBoost'), 0.9)
        success:
        - id: DisplayMessage
          message: message.largeModelSuccess
          confirm: message.party
        - id: UpdateItemAmounts
          updates:
            majorResult: 1
            preliminaryResult: -1
            figure: 1
        - id: UpdateVariables
          updates:
            player.hope: player.hope + 8
            player.pubWeight: player.pubWeight + 2
            player.citations: player.citations + randi(10) + 5
        fail:
        - id: DisplayMessage
          message: message.largeModelFail
          confirm: message.sucks
        - id: UpdateVariable
          variable: player.hope
          value: player.hope - 6
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.workOnFigure
      requirement: itemCount('majorResult') > 0 && itemCount('figure') < rule.figuresRequired * itemCount('majorResult') && !hasStatus('brokenEquipment') && player.compute >= 2 && itemCount('paper') < rule.papersRequired
      actions:
      - id: UpdateVariable
        variable: player.compute
        value: player.compute - 2
      - id: Random
        groups:
        - weight: 0.65 + getAttributeValue('player.experimentBoost')
          actions:
          - id: DisplayMessage
            message: message.gainFigure
            confirm: message.great
          - id: GiveItem
            itemId: figure
            amount: 1
          - id: UpdateVariable
            variable: player.hope
            value: player.hope + 5
        - weight: 0.25
          actions:
          - id: DisplayRandomMessage
            messages:
            - message.noFigure1
            - message.noFigure2
            - message.noFigure3
            - message.noFigure4
            confirm: message.ok
          - id: UpdateVariable
            variable: player.hope
            value: player.hope - 5
        - weight: 0.15
          actions:
          - id: Switch
            branches:
            - condition: hasStatus('cloudStorage')
              actions:
              - id: DisplayMessage
                message: message.lostDataRecovered
                confirm: message.cool
              - id: GiveItem
                itemId: figure
                amount: 1
              - id: UpdateVariable
                variable: player.hope
                value: player.hope + 5
            - condition: 1
              actions:
              - id: DisplayMessage
                message: message.lostData
                confirm: message.unfortunate
              - id: UpdateVariable
                variable: player.hope
                value: player.hope - 5
        - weight: 0.1
          actions:
          - id: DisplayMessage
            message: message.wrongFigure
            confirm: message.unfortunate
          - id: UpdateVariable
            variable: player.hope
            value: player.hope - 5
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.workOnPaper
      requirement: itemCount('majorResult') > 0 && itemCount('figure') >= rule.figuresRequired && itemCount('paper') < rule.papersRequired
      actions:
      - id: CoinFlip
        probability: 0.8 + itemCount('paper') / 20
        success:
        - id: DisplayMessage
          message: message.draftPaperComplete
          confirm: message.great
        - id: UpdateItemAmounts
          updates:
            paperDraft: 1
            majorResult: -1
            figure: -rule.figuresRequired
        - id: UpdateVariables
          updates:
            player.hope: player.hope + 3
            player.exhaustionLevel: player.exhaustionLevel + 1
        fail:
        - id: DisplayRandomMessage
          messages:
          - message.draftPaperIncomplete1
          - message.draftPaperIncomplete2
          - message.draftPaperIncomplete3
          - message.draftPaperIncomplete4
          - message.draftPaperIncomplete5
          - message.draftPaperIncomplete6
          - message.draftPaperIncomplete7
          confirm: message.ok
    - message: message.postPreprint
      requirement: (itemCount('majorResult') > 0 || itemCount('paperDraft') > 0) && !hasStatus('preprinted') && itemCount('paper') < rule.papersRequired
      actions:
      - id: DisplayMessage
        message: message.preprintPosted
        confirm: message.cool
      - id: SetStatus
        statusId: preprinted
        on: true
      - id: UpdateVariables
        updates:
          player.pubWeight: player.pubWeight + 1
          player.citations: player.citations + randi(5) + 1
          player.hope: player.hope + 3
    - message: message.revisePaper
      requirement: itemCount('rejectedPaper') > 0 && itemCount('paper') < rule.papersRequired
      actions:
      - id: DisplayMessage
        message: message.revisionComplete
        confirm: message.hopeAccepted
      - id: UpdateItemAmounts
        updates:
          paperDraft: 1
          rejectedPaper: -1
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.applyInternship
      requirement: year >= 2 && month <= 4 && !hasStatus('interned') && itemCount('paper') < rule.papersRequired
      actions:
      - id: CoinFlip
        probability: clip(0.40 + player.pubWeight * 0.03 + player.citations / 300, 0.2, 0.95)
        success:
        - id: SetStatus
          statusId: interned
          on: true
        - id: Random
          groups:
          # Frontier research lab: huge compute, publishable, big reputation.
          - weight: 1
            actions:
            - id: DisplayRandomMessage
              messages:
              - message.internFrontierLab1
              - message.internFrontierLab2
              confirm: message.party
            - id: GiveItem
              itemId: idea
              amount: 1
            - id: SetStatus
              statusId: internCreditsBig
              on: true
            - id: UpdateVariables
              updates:
                player.hope: player.hope + 10
                player.pubWeight: player.pubWeight + 2
                player.citations: player.citations + randi(10) + 5
                player.internCount: player.internCount + 1
                player.researchIntern: 1
                player.bigTechIntern: 1
                advisor.happiness: advisor.happiness + 2
          # Big-tech research lab: lots of compute, publishable.
          - weight: 1.5
            actions:
            - id: DisplayRandomMessage
              messages:
              - message.internBigTechResearch1
              - message.internBigTechResearch2
              confirm: message.great
            - id: GiveItem
              itemId: idea
              amount: 1
            - id: SetStatus
              statusId: internCreditsMed
              on: true
            - id: UpdateVariables
              updates:
                player.hope: player.hope + 8
                player.pubWeight: player.pubWeight + 1
                player.citations: player.citations + randi(6) + 2
                player.internCount: player.internCount + 1
                player.researchIntern: 1
                player.bigTechIntern: 1
                advisor.happiness: advisor.happiness + 1
          # Product team: good money & compute, but you CANNOT publish.
          - weight: 2
            actions:
            - id: DisplayRandomMessage
              messages:
              - message.internProduct1
              - message.internProduct2
              confirm: message.cool
            - id: SetStatus
              statusId: internCreditsMed
              on: true
            - id: UpdateVariables
              updates:
                player.hope: player.hope + 11
                player.internCount: player.internCount + 1
                player.bigTechIntern: 1
                advisor.happiness: advisor.happiness - 1
          # GPU-rich company: a mountain of GPUs, occasional publishing.
          - weight: 1.2
            actions:
            - id: DisplayRandomMessage
              messages:
              - message.internGpuRich1
              - message.internGpuRich2
              confirm: message.party
            - id: GiveItem
              itemId: idea
              amount: 1
            - id: SetStatus
              statusId: internCreditsBig
              on: true
            - id: UpdateVariables
              updates:
                player.hope: player.hope + 6
                player.pubWeight: player.pubWeight + 1
                player.internCount: player.internCount + 1
                player.bigTechIntern: 1
          # Startup: scrappy, little compute, fast-moving, publishable.
          - weight: 1.3
            actions:
            - id: DisplayRandomMessage
              messages:
              - message.internStartup1
              - message.internStartup2
              confirm: message.soundsInteresting
            - id: GiveItem
              itemId: idea
              amount: 2
            - id: UpdateVariables
              updates:
                player.hope: player.hope + 8
                player.pubWeight: player.pubWeight + 1
                player.citations: player.citations + randi(4) + 1
                player.internCount: player.internCount + 1
                player.researchIntern: 1
        fail:
        - id: DisplayMessage
          message: message.noInternOffer
          confirm: message.unfortunate
        - id: UpdateVariable
          variable: player.hope
          value: player.hope - 3
    - message: message.slackOff
      requirement: itemCount('paper') < rule.papersRequired
      actions:
      - id: Random
        groups:
        - weight: 1
          actions:
          - id: DisplayRandomMessage
            messages:
            - message.caughtSlackOff1
            - message.caughtSlackOff2
            - message.caughtSlackOff3
            confirm: message.oops
          - id: UpdateVariables
            updates:
              advisor.happiness: advisor.happiness - 2
        - weight: 2
          actions:
          - id: DisplayMessage
            message: message.slackOffSuccess
            confirm: message.great
          - id: UpdateVariable
            variable: player.hope
            value: player.hope + 5
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: 0
      - id: SetStatus
        statusId: exhaustion
        on: false
# ===========================================================================
# Real conference submission calendar (game month == calendar month)
#   ICLR    : submit Sep (9)  -> decide Jan (1)
#   ICML    : submit Feb (2)  -> decide May (5)
#   NeurIPS : submit May (5)  -> decide Sep (9)
#   CVPR    : submit Nov (11) -> decide Feb (2)
# You hold a draft and choose which open deadline to target.
# ===========================================================================
- id: DeadlineICLR
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 9 && itemCount('paperDraft') > 0 && itemCount('submittedICLR') === 0
  actions:
  - id: DisplayChoices
    message: message.deadlineICLR
    choices:
    - message: message.submitICLR
      actions:
      - id: DisplayMessage
        message: message.submittedToICLR
        confirm: message.hopeAccepted
      - id: UpdateItemAmounts
        updates:
          paperDraft: -1
          submittedICLR: 1
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.holdSubmission
      actions:
      - id: DisplayMessage
        message: message.heldSubmission
        confirm: message.ok
- id: DeadlineICML
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 2 && itemCount('paperDraft') > 0 && itemCount('submittedICML') === 0
  actions:
  - id: DisplayChoices
    message: message.deadlineICML
    choices:
    - message: message.submitICML
      actions:
      - id: DisplayMessage
        message: message.submittedToICML
        confirm: message.hopeAccepted
      - id: UpdateItemAmounts
        updates:
          paperDraft: -1
          submittedICML: 1
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.holdSubmission
      actions:
      - id: DisplayMessage
        message: message.heldSubmission
        confirm: message.ok
- id: DeadlineNeurIPS
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 5 && itemCount('paperDraft') > 0 && itemCount('submittedNeurIPS') === 0
  actions:
  - id: DisplayChoices
    message: message.deadlineNeurIPS
    choices:
    - message: message.submitNeurIPS
      actions:
      - id: DisplayMessage
        message: message.submittedToNeurIPS
        confirm: message.hopeAccepted
      - id: UpdateItemAmounts
        updates:
          paperDraft: -1
          submittedNeurIPS: 1
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.holdSubmission
      actions:
      - id: DisplayMessage
        message: message.heldSubmission
        confirm: message.ok
- id: DeadlineCVPR
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 11 && itemCount('paperDraft') > 0 && itemCount('submittedCVPR') === 0
  actions:
  - id: DisplayChoices
    message: message.deadlineCVPR
    choices:
    - message: message.submitCVPR
      actions:
      - id: DisplayMessage
        message: message.submittedToCVPR
        confirm: message.hopeAccepted
      - id: UpdateItemAmounts
        updates:
          paperDraft: -1
          submittedCVPR: 1
      - id: UpdateVariable
        variable: player.exhaustionLevel
        value: player.exhaustionLevel + 1
    - message: message.holdSubmission
      actions:
      - id: DisplayMessage
        message: message.heldSubmission
        confirm: message.ok
# --- Decisions (notification months) ---
- id: DecisionICLR
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 1 && itemCount('submittedICLR') > 0
  actions:
  - id: CoinFlip
    probability: clip(0.32 + getAttributeValue('player.paperAcceptanceBoost') + min(player.pubWeight * 0.02, 0.2), 0.05, 0.9)
    success:
    - id: DisplayMessage
      message: message.acceptedICLR
      confirm: message.party
    - id: UpdateItemAmounts
      updates:
        submittedICLR: -1
        paper: 1
    - id: UpdateVariables
      updates:
        player.hope: player.hope + 12
        advisor.happiness: advisor.happiness + 5
    - id: TriggerEvents
      triggers:
      - id: PaperFate
    fail:
    - id: DisplayRandomMessage
      messages:
      - message.paperRejected1
      - message.paperRejected2
      - message.paperRejected3
      - message.paperRejected4
      - message.paperRejected5
      - message.paperRejected6
      - message.paperRejected7
      - message.paperRejected8
      - message.paperRejected9
      - message.paperRejected10
      confirm: message.unfortunate
    - id: UpdateItemAmounts
      updates:
        submittedICLR: -1
        rejectedPaper: 1
    - id: UpdateVariable
      variable: player.hope
      value: player.hope - 10

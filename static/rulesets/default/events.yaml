  actions:
  - id: DisplayRandomMessage
    messages:
    - message.randomHope1
    - message.randomHope2
    - message.randomHope3
    - message.randomHope4
    - message.randomHope5
    confirm: message.cool
  - id: UpdateVariable
    variable: player.hope
    value: player.hope + 5
- id: ModelGoesViral
  trigger: MonthBegin
  probability: 0.07
  conditions:
  - id: Expression
    expression: itemCount('paper') >= 1 || hasStatus('preprinted')
  actions:
  - id: DisplayRandomMessage
    messages:
    - message.modelViral1
    - message.modelViral2
    confirm: message.party

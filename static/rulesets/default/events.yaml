      player.hope: player.hope + 6
      player.citations: player.citations + randi(15) + 10
      player.pubWeight: player.pubWeight + 1
# ===========================================================================
# Internships
#   - Apply yourself: a menu action (costs the month), success scales with rep.
#   - Get headhunted: a recruiter / your advisor reaches out when your paper &
#     citation count are high — a better, research-focused offer for free.
# Different internships differ in compute and whether you can publish.
# `interned` status (~10 months) limits you to roughly one internship per year.
# ===========================================================================
- id: RecruiterReachout
  trigger: MonthBegin
  probability: 0.5
  conditions:
  - id: Expression
    expression: year >= 2 && month >= 1 && month <= 5 && !hasStatus('interned') && itemCount('paper') < rule.papersRequired && (player.pubWeight >= 2 || player.citations >= 60)
  actions:
  - id: DisplayChoices
    message: message.recruiterReachout
    choices:
    - message: message.acceptInternship
      actions:
      - id: SetStatus
        statusId: interned
        on: true
      - id: Random
        groups:
        # Frontier research lab: huge compute, you can publish, big reputation.
        - weight: 1
          actions:
          - id: DisplayRandomMessage
            messages:
            - message.internFrontierLab1
            - message.internFrontierLab2
            confirm: message.party
          - id: GiveItem
            itemId: idea
            amount: 1
          - id: SetStatus
            statusId: internCreditsBig
            on: true
          - id: UpdateVariables
            updates:
              player.hope: player.hope + 10
              player.pubWeight: player.pubWeight + 2
              player.citations: player.citations + randi(10) + 5
              player.internCount: player.internCount + 1
              player.researchIntern: 1
              player.bigTechIntern: 1
              advisor.happiness: advisor.happiness + 2
        # Big-tech research lab: lots of compute, publishable.
        - weight: 1
          actions:
          - id: DisplayRandomMessage
            messages:
            - message.internBigTechResearch1
            - message.internBigTechResearch2
            confirm: message.great
          - id: GiveItem
            itemId: idea
            amount: 1
          - id: SetStatus
            statusId: internCreditsMed
            on: true
          - id: UpdateVariables
            updates:
              player.hope: player.hope + 8
              player.pubWeight: player.pubWeight + 1
              player.citations: player.citations + randi(6) + 2
              player.internCount: player.internCount + 1
              player.researchIntern: 1
              player.bigTechIntern: 1
              advisor.happiness: advisor.happiness + 1
    - message: message.declineInternship
      actions:
      - id: DisplayMessage
        message: message.internshipDeclined
        confirm: message.ok
      - id: UpdateVariables
        updates:
          player.hope: player.hope + 2
          advisor.happiness: advisor.happiness + 1
# Advisor nudges
- id: TooManyIdeas
  trigger: MonthBegin
  once: true
  conditions:
  - id: Expression
    expression: itemCount('idea') >= 4
  actions:
  - id: DisplayMessage
    message: message.tooManyIdeas
    confirm: message.ok
  - id: UpdateVariable
    variable: advisor.happiness
    value: advisor.happiness - 2
- id: NotEnoughPapers
  trigger: MonthBegin
  once: true
  conditions:
  - id: Expression
    expression: year >= 3 && itemCount('paper') <= 1
  actions:
  - id: DisplayMessage
    message: message.notEnoughPapers
    confirm: message.workingOnIt
  - id: UpdateVariable
    variable: advisor.happiness
    value: advisor.happiness - 3
- id: RejectedPaper
  trigger: MonthBegin
  once: true
  probability: 0.8
  conditions:
  - id: Expression
    expression: itemCount('rejectedPaper') > 0
  actions:
  - id: DisplayMessage
    message: message.rejectedPaperAdvisor
    confirm: message.encouraging
  - id: UpdateVariable
    variable: player.hope
    value: player.hope + 5
# ===========================================================================
# Academic service, reproducibility, fellowships, and AI-world drama
# ===========================================================================
- id: ReviewRequest
  trigger: MonthBegin
  probability: 0.10
  conditions:
  - id: Expression
    expression: (itemCount('paper') >= 1 || hasStatus('preprinted')) && itemCount('paper') < rule.papersRequired
  actions:
  - id: DisplayChoices
    message: message.reviewRequest
    choices:
    - message: message.acceptReview
      actions:
      - id: DisplayMessage
        message: message.acceptedReview
        confirm: message.gotit
      - id: UpdateVariables
        updates:
          player.serviceRep: player.serviceRep + 1
          player.exhaustionLevel: player.exhaustionLevel + 1
          advisor.happiness: advisor.happiness + 1
    - message: message.declineReview
      actions:
      - id: DisplayMessage
        message: message.declinedReview
        confirm: message.ok
- id: CodeRelease
  trigger: MonthBegin
  probability: 0.4
  conditions:
  - id: Expression
    expression: itemCount('paper') >= 1 && !hasStatus('codeReleased')
  actions:
  - id: DisplayChoices
    message: message.codeReleasePrompt
    choices:
    - message: message.releaseCode
      actions:
      - id: DisplayMessage
        message: message.codeReleased
        confirm: message.great
      - id: SetStatus
        statusId: codeReleased
        on: true
      - id: UpdateVariables
        updates:
          player.pubWeight: player.pubWeight + 1
          player.citations: player.citations + randi(8) + 3
          player.hope: player.hope + 3
    - message: message.skipCodeRelease
      actions:
      - id: DisplayMessage
        message: message.skippedCodeRelease
        confirm: message.ok
- id: ReproducibilityCallout
  trigger: MonthBegin
  once: true
  probability: 0.5
  conditions:
  - id: Expression
    expression: itemCount('paper') >= 2 && !hasStatus('codeReleased') && year >= 4
  actions:
  - id: DisplayMessage
    message: message.reproCallout
    confirm: message.sucks
  - id: UpdateVariable
    variable: player.hope
    value: player.hope - 5
- id: Fellowship
  trigger: YearBegin
  once: true
  probability: 0.5
  conditions:
  - id: Expression
    expression: year >= 2 && year <= 4 && (player.pubWeight >= 1 || player.citations >= 30)
  actions:
  - id: CoinFlip
    probability: clip(0.3 + player.pubWeight * 0.05 + player.citations / 400, 0.1, 0.85)
    success:
    - id: DisplayRandomMessage
      messages:
      - message.fellowshipWon1
      - message.fellowshipWon2
      confirm: message.party
    - id: SetStatus
      statusId: fellowship
      on: true
    - id: UpdateVariables
      updates:
        advisor.fundingLevel: advisor.fundingLevel + 1
        player.hope: player.hope + 8
        player.letterStrength: player.letterStrength + 0.5
    fail:
    - id: DisplayMessage
      message: message.fellowshipLost
      confirm: message.unfortunate
# A new foundation model drops and obsoletes your project -> forced pivot.
- id: Obsolescence
  trigger: MonthBegin
  probability: 0.045
  conditions:
  - id: Expression
    expression: year >= 2 && (itemCount('majorResult') > 0 || itemCount('paperDraft') > 0) && itemCount('paper') < rule.papersRequired
  actions:
  - id: DisplayRandomMessage
    messages:
    - message.obsolescence1
    - message.obsolescence2
    confirm: message.sucks
  - id: Switch
    branches:
    - condition: itemCount('paperDraft') > 0
      actions:
      - id: UpdateItemAmounts
        updates:
          paperDraft: -1
    - condition: 1
      actions:
      - id: UpdateItemAmounts
        updates:
          majorResult: -1
  - id: GiveItem
    itemId: idea
    amount: 1
  - id: UpdateVariable
    variable: player.hope
    value: player.hope - 8
- id: FamousCitation
  trigger: MonthBegin
  probability: 0.06
  conditions:
  - id: Expression
    expression: itemCount('paper') >= 1
  actions:
  - id: DisplayRandomMessage
    messages:
    - message.famousCitation1
    - message.famousCitation2
    confirm: message.party
  - id: UpdateVariables
    updates:
      player.citations: player.citations + randi(12) + 5
      player.hope: player.hope + 4
- id: GpuShortageEvent
  trigger: MonthBegin
  once: true
  probability: 0.3
  conditions:
  - id: Expression
    expression: year >= 2 && !hasStatus('gpuShortage')
  actions:
  - id: DisplayMessage
    message: message.gpuShortageNews
    confirm: message.sucks
  - id: SetStatus
    statusId: gpuShortage
    on: true
- id: DatasetScandal
  trigger: MonthBegin
  once: true
  probability: 0.25
  conditions:
  - id: Expression
    expression: year >= 3 && itemCount('paper') >= 1
  actions:
  - id: DisplayMessage
    message: message.datasetScandal
    confirm: message.oops
  - id: UpdateVariable
    variable: player.hope
    value: player.hope - 3
# ===========================================================================
# Graduation & final placement
#   - You may graduate any time once you meet the bar (the thesis action).
#   - From year 7 on, if you meet the bar, your advisor pushes you out.
#   - On graduating, pick academia or industry; placement depends on your
#     papers, citations and internship record (plus some luck).
# ===========================================================================
- id: ForcedGraduation
  trigger: MonthBegin
  once: true
  conditions:
  - id: Expression
    expression: year >= 7 && itemCount('paper') >= rule.papersRequired && player.graduating === 0
  actions:
  - id: DisplayMessage
    message: message.forcedGraduation
    confirm: message.gotit
  - id: UpdateVariable
    variable: player.graduating
    value: 1
- id: Graduation
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: player.graduating === 1
  actions:
  - id: UpdateVariable
    variable: player.finalPapers
    value: itemCount('paper')
  - id: DisplayMessage
    message: message.graduated
    confirm: message.party
  - id: DisplayMessage
    message: message.reportCard
    confirm: message.great
  - id: DisplayChoices
    message: message.chooseCareer
    choices:
    - message: message.goAcademia
      actions:
      - id: UpdateVariable
        variable: player.finalScore
        value: itemCount('paper') * 12 + player.citations / 8 + player.researchIntern * 10 + player.letterStrength * 6 + player.serviceRep * 2 + randi(20)
      - id: Switch
        branches:
        - condition: player.finalScore >= 75
          actions:
          - id: EndGame
            message: message.academiaTop
            confirm: message.party
            winning: true
            fx: confetti
        - condition: player.finalScore >= 48
          actions:
          - id: EndGame
            message: message.academiaMid
            confirm: message.party
            winning: true
            fx: confetti
        - condition: player.finalScore >= 26
          actions:
          - id: EndGame
            message: message.academiaPostdoc
            confirm: message.great
            winning: true
        - condition: 1
          actions:
          - id: EndGame
            message: message.academiaLow
            confirm: message.ok
            winning: true
    - message: message.goIndustry
      actions:
      - id: UpdateVariable
        variable: player.finalScore
        value: itemCount('paper') * 7 + player.citations / 12 + player.bigTechIntern * 12 + player.researchIntern * 5 + player.letterStrength * 4 + randi(20)
      - id: Switch
        branches:
        - condition: player.finalScore >= 65
          actions:
          - id: EndGame
            message: message.industryTop
            confirm: message.party
            winning: true
            fx: confetti
        - condition: player.finalScore >= 40
          actions:
          - id: EndGame
            message: message.industryMid
            confirm: message.party
            winning: true
            fx: confetti
        - condition: player.finalScore >= 22
          actions:
          - id: EndGame
            message: message.industryGood
            confirm: message.great
            winning: true
        - condition: 1
          actions:
          - id: EndGame
            message: message.industryStartup
            confirm: message.cool
            winning: true

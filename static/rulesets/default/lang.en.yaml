# ---------------------------------------------------------------------------
# Items
# ---------------------------------------------------------------------------
item.idea: Research Idea
item.idea.description: A spark of a research idea, scribbled on a whiteboard. Run a quick experiment (costs compute) to see if it has any signal.
item.preliminaryResult: Toy-Scale Result
item.preliminaryResult.description: A promising result on a tiny benchmark. Scale it up — or train a large model — to turn it into a headline result.
item.majorResult: SOTA Result
item.majorResult.description: A state-of-the-art result that beats the strong baselines. With {{rule.figuresRequired}} solid plots / ablations, you can draft a paper.
item.figure: Plot / Ablation
item.figure.description: A clean figure or ablation that survives scrutiny. With {{rule.figuresRequired}} of them plus a SOTA result, you can draft a paper.
item.paperDraft: Paper Draft
item.paperDraft.description: A finished manuscript, ready to submit. Wait for the next conference deadline (ICLR / ICML / NeurIPS / CVPR) and submit it.
item.submittedICLR: Under Review @ ICLR
item.submittedICLR.description: Submitted to ICLR. Decisions come out in January.
item.submittedICML: Under Review @ ICML
item.submittedICML.description: Submitted to ICML. Decisions come out in May.
item.submittedNeurIPS: Under Review @ NeurIPS
item.submittedNeurIPS.description: Submitted to NeurIPS. Decisions come out in September.
item.submittedCVPR: Under Review @ CVPR
item.submittedCVPR.description: Submitted to CVPR. Decisions come out in February.
item.rejectedPaper: Rejected Submission
item.rejectedPaper.description: A rejected submission. Revise it into a fresh draft and aim for the next deadline.
item.paper: Accepted Paper
item.paper.description: An accepted paper at a top-tier conference. A real line on your CV — and a steady source of citations.

# ---------------------------------------------------------------------------
# Status effects
# ---------------------------------------------------------------------------
status.firstYear: First-Year Hype
status.firstYear.description: "**+1 hope** every month. Everything is exciting before your first rejection."
status.brokenEquipment: GPU Cluster Down
status.brokenEquipment.description: The cluster is unreachable. You cannot run experiments this month.
status.upgradedEquipment: New GPU Node
status.upgradedEquipment.description: Your advisor secured fresh H100s. Experiments are more likely to succeed and you regenerate more compute each month.
status.cloudStorage: Auto-Checkpointing
status.cloudStorage.description: Checkpoints are synced to a cloud bucket automatically. A crash is far less likely to wipe your results.
status.interned: On Internship
status.interned.description: You've done an internship recently. You can take another one next year.
status.preprinted: arXiv Preprint Out
status.preprinted.description: You have a preprint staking your claim. Lower chance of being scooped, plus a steady citation trickle.
status.strongRebuttal: Strong Rebuttal
status.strongRebuttal.description: You wrote a compelling, data-backed rebuttal. Your acceptance odds are temporarily boosted.
status.wellCited: Well-Cited
status.wellCited.description: Your work is getting noticed. **+10% acceptance odds.**
status.influential: Influential Researcher
status.influential.description: You are a name in the field now. **+15% acceptance odds** and **+1 hope** every month.
status.exhaustion: Burnout
status.exhaustion.description: "**-5 hope** every month. Time to step away from the terminal and rest."
status.lateYearAnxiety: Senior-Student Anxiety
status.lateYearAnxiety.description: "**-1 hope** every month. You keep wondering if you will ever graduate."
status.unhappyAdvisor: Unhappy Advisor
status.unhappyAdvisor.description: "**-5 hope** every month. Your advisor is not impressed with your recent progress."

# ---------------------------------------------------------------------------
# Coursework (first two years)
# ---------------------------------------------------------------------------
message.courseworkNotice: "DEPARTMENT NOTE: your first two years include required **coursework**. Classes and problem sets will eat into your research time now and then — there's no high-stakes qualifying exam, just less time in the lab early on."
message.coursework1: Midterms week. Problem sets and a course report swallowed your research time this month.
message.coursework2: You spent the month TA-ing and finishing a course project. Little time for your own research.
message.coursework3: A heavy course load (and a final exam) kept you out of the lab this month.
message.courseworkIdea: A lecture in your ML theory course actually sparked a research idea. Coursework wasn't a total loss this month.

# ---------------------------------------------------------------------------
# Burnout
# ---------------------------------------------------------------------------
message.exhaustion: After months of back-to-back deadlines and 3 a.m. training runs, you began to burn out and could not focus.
message.exhaustionBreak: Your advisor noticed you looked wrecked lately and sent you an article about sustainable research and work-life balance.
message.takeBreak: Ask your advisor for a few days off.
message.recoveredAfterBreak: Your advisor approved it. You logged off Slack, slept, and came back **reinvigorated**.
message.noBreak: I'm fine, really.
message.exhaustionIgnored: You told yourself the deadline was more important and kept grinding.
message.exhaustionBadMonth: You stared at the loss curve for hours but nothing went in. Your brain is fried and you need a real break.
message.exhaustionNoProgress: You forced yourself to keep coding, but it did not help. No progress this month.

# ---------------------------------------------------------------------------
# Senior-student anxiety
# ---------------------------------------------------------------------------
message.lateYearAnxiety: Three years in. You have watched cohort after cohort defend and leave, and you start to worry whether you will graduate on time.

# ---------------------------------------------------------------------------
# Compute budget / funding
# ---------------------------------------------------------------------------
message.computeStarved: Your GPU quota is nearly exhausted. Big experiments are off the table until your compute budget refills (it grows faster with more funding and a better cluster).
message.fundingRises: "AI NEWS: a wave of new grants and industry gifts is flowing into ML labs. \"Compute is the new oil,\" a program manager declared."
message.fundingFalls: "AI NEWS: GPU prices spiked and several grants were frozen this fiscal year. Compute budgets are likely to tighten."
message.moreFunding: Your advisor landed a new grant (and a pile of cloud credits). Your monthly compute budget went up.
message.lessFunding: Your advisor's grant renewal stalled. The lab quietly started rationing GPU hours.
message.lostFunding: A cloud bill came due and one project's **compute budget was slashed**. The lab is on edge.

# ---------------------------------------------------------------------------
# Unhappy advisor
# ---------------------------------------------------------------------------
message.unhappyAdvisor: Your advisor seems unimpressed with your recent progress. "Research is hard, but I'd like to see more momentum from you."
message.advisorHappyAgain: Your advisor seems genuinely pleased with your recent progress.

# ---------------------------------------------------------------------------
# Main game flow
# ---------------------------------------------------------------------------
message.beginning: Congratulations — you've been **admitted** to a top AI PhD program. Will you accept the offer?
message.acceptOffer: Accept the offer.
message.acceptedOffer: You accepted and joined a lab. To graduate, you must publish at least **{{rule.papersRequired}} papers** at top-tier conferences (ICLR, ICML, NeurIPS, CVPR). You start with a small **GPU budget** — spend it wisely.
message.declineOffer: Decline and take the big-tech job.
message.declinedOffer: You declined the offer and took a well-paid research-engineer role instead. Perhaps the wiser timeline.
message.newMonth: A new month begins. Let's check the to-do list.
message.readPapers: Read papers on arXiv.
message.gainNewIdea1: After scrolling through arXiv and a dozen abstracts, a **new research idea** clicked.
message.gainNewIdea2: After staring at a related-work section for hours, you spotted a gap and got a **new idea**.
message.workOnIdea: Run a quick experiment (−1 GPU).
message.oldIdea1: You pitched the idea to your advisor, who pulled up a 2019 paper that already did exactly this.
message.oldIdea2: Your advisor thought the idea was incremental and asked you to think bigger.
message.oldIdea3: Your advisor felt the idea was not novel enough and told you to read more of the recent literature.
message.oldIdea4: You had a burst of ideas — but a quick Semantic Scholar search showed every one of them was already published.
message.noIdea1: You opened 60 arXiv tabs and your browser **crashed**. You lost track of everything you were reading.
message.gainPrelimResult: The idea shows signal on a toy benchmark! You have a **toy-scale result**.
message.ideaNotWorking: The idea flatlined — no better than the baseline. On to the next one.
message.workOnPrelimResult: Scale up a toy result (−3 GPU).
message.gainMajorResult: It scales! You beat the strong baselines and have a **SOTA result**.
message.noMajorResult1: You're sure there's a real result here, but training keeps diverging at scale. You need more time.
message.noMajorResult2: Your advisor spotted a data-leakage bug that inflated your numbers. Back to the drawing board.
message.trainLargeModel: Train a large model (−8 GPU, high impact).
message.largeModelSuccess: You burned a huge chunk of compute on a large-scale run — and it **worked spectacularly**. A headline SOTA result, a striking figure, and the community is already talking about it.
message.largeModelFail: The large run **diverged** halfway through (NaN loss, then OOM). You torched a small fortune in GPU hours for nothing.
message.workOnFigure: Run ablations / make plots (−2 GPU).
message.gainFigure: The ablations are clean and convincing. You produced a beautiful **plot**.
message.noFigure1: The runs came back noisy and inconclusive. You'll need more seeds and more compute.
message.noFigure2: Your job hit **CUDA out of memory** and died at epoch 47. Time to redo it with gradient checkpointing.
message.noFigure3: The training run is taking far longer than expected; the results aren't in yet.
message.noFigure4: A dependency upgrade broke your environment. You burned days fixing CUDA / PyTorch versions and need more time.
message.lostData: A node crashed mid-run and your checkpoints were lost. You'll have to rerun the experiments.
message.lostDataRecovered: A node crashed mid-run — but auto-checkpointing **restored** everything from the cloud bucket, and you got your **plot**.
message.wrongFigure: Your numbers contradict each other; there's a bug somewhere in the eval. You need time to track it down.
message.workOnPaper: Write up the paper.
message.draftPaperComplete: You finished the **draft**. It's ready — now wait for the next conference deadline to submit it.
message.draftPaperIncomplete1: Your advisor was too swamped to read the draft this cycle.
message.draftPaperIncomplete2: Despite your efforts, the related-work section still needs work. Not done yet.
message.draftPaperIncomplete3: Despite your efforts, the experiments section needs more analysis. Not done yet.
message.draftPaperIncomplete4: You spent the whole month fighting LaTeX figure placement and the 9-page limit. Still not done.
message.draftPaperIncomplete5: There are still a couple of sections half-written. Almost there.
message.draftPaperIncomplete6: Your advisor read the draft and wants the abstract and intro completely rewritten.
message.draftPaperIncomplete7: Your advisor flagged several figures as unconvincing. You'll need more time to fix them.
message.postPreprint: Post a preprint on arXiv.
message.preprintPosted: You posted your work to **arXiv**, staking your claim before someone scoops you. It starts picking up early citations and your name gets around.
message.revisePaper: Revise a rejected paper into a fresh draft.
message.revisionComplete: You addressed the reviews point by point, ran the requested experiments, and turned the rejection into a polished new **draft**, ready for the next deadline.

# --- Conference deadlines & decisions ---
message.deadlineICLR: "**ICLR deadline** is this month (decisions in January). Submit your draft?"
message.submitICLR: Submit to ICLR.
message.submittedToICLR: You submitted to **ICLR** and uploaded everything to OpenReview minutes before the deadline.
message.deadlineICML: "**ICML deadline** is this month (decisions in May). Submit your draft?"
message.submitICML: Submit to ICML.
message.submittedToICML: You submitted to **ICML** just before the portal closed.
message.deadlineNeurIPS: "**NeurIPS deadline** is this month (decisions in September). Submit your draft?"
message.submitNeurIPS: Submit to NeurIPS.
message.submittedToNeurIPS: You submitted to **NeurIPS** — the most competitive venue of the year. Good luck.
message.deadlineCVPR: "**CVPR deadline** is this month (decisions in February). Submit your draft?"
message.submitCVPR: Submit to CVPR.
message.submittedToCVPR: You submitted to **CVPR** right at the deadline.
message.holdSubmission: Hold it — keep polishing for a better-fit venue.
message.heldSubmission: You decided to wait for a venue that fits the work better (or just to add one more experiment).
message.acceptedICLR: "OPENREVIEW: Your paper has been **ACCEPTED to ICLR**! Average rating: strong accept."
message.acceptedICML: "OPENREVIEW: Your paper has been **ACCEPTED to ICML**! Off to the conference."
message.acceptedNeurIPS: "OPENREVIEW: Your paper has been **ACCEPTED to NeurIPS**! A line on your CV that actually matters."
message.acceptedCVPR: "OPENREVIEW: Your paper has been **ACCEPTED to CVPR**! Congratulations."
message.paperRejected1: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. Reviewer 2 wrote: \"Novelty is limited; this is an incremental delta over prior work.\""
message.paperRejected2: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer found a flaw in your theoretical derivation."
message.paperRejected3: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"The improvements are within noise; no error bars are reported.\""
message.paperRejected4: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer demanded comparison against three more recent baselines."
message.paperRejected5: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"Why does it work? No insight or analysis is provided.\""
message.paperRejected6: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer found the paper unreadable and the notation inconsistent."
message.paperRejected7: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer questioned whether results hold beyond your cherry-picked setting."
message.paperRejected8: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"Interesting, but not a top-venue-level contribution.\""
message.paperRejected9: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer demanded experiments on ImageNet-scale data and a 7B model."
message.paperRejected10: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"No code or reproducibility statement provided. Score: 3.\""
message.slackOff: Slack off (touch grass).
message.caughtSlackOff1: Your advisor caught you off Slack for a week and pinged you a long list of TODOs.
message.caughtSlackOff2: Your advisor stopped by the lab, found your seat empty, and emailed asking about your progress.
message.caughtSlackOff3: Your advisor sent three messages with no reply, then asked the whole group when you'd last pushed code.
message.slackOffSuccess: You went hiking, ignored OpenReview for a weekend, and felt human again.
message.lostAllHope: You lost all hope and **dropped out** to take an industry job.
message.overdue: You **ran out of time** and could not finish your PhD.
message.workOnThesis: Write up & defend your thesis (graduate).
message.decideToGraduate: You've cleared the bar. You decide to write up your thesis and schedule your defense.
message.forcedGraduation: "Your advisor pulls you aside: \"You've got enough papers and you've been here a while. It's time — write it up and get out. I need the desk for a new student.\""
message.graduated: You stapled your papers into a thesis and **passed your defense**. You're officially **Dr. You-Now**! Now — what next?
message.chooseCareer: Where will you take your shiny new PhD?
message.goAcademia: Go on the **academic** job market.
message.goIndustry: Go to **industry**.
# --- Academia placements (best to worst) ---
message.academiaTop: "**ACADEMIA — DREAM OUTCOME.** With your stellar record, you land a **tenure-track faculty** offer at a top department (think Stanfjord / Massivechusetts Institute of Tech / Berzerkeley). Your future students will run this simulator. 🎓"
message.academiaMid: "**ACADEMIA.** You earn a **faculty offer at a solid research university** (Carnegie Meowlon / UC Sunnyvale). Grants to write, students to advise — the grind continues, but it's yours now."
message.academiaPostdoc: "**ACADEMIA — POSTDOC.** No faculty offer yet, but you secure a **prestigious postdoc** to strengthen your record and try the market again next year. Onward."
message.academiaLow: "**ACADEMIA didn't pan out.** The faculty market was brutal this cycle. You take a research-scientist role instead — PhD in hand, you'll be just fine."
# --- Industry placements (best to worst) ---
message.industryTop: "**INDUSTRY — DREAM OUTCOME.** A frontier lab (DeepKind / OpenAEye / Entropic) hires you as a **Research Scientist** with a jaw-dropping package and a cluster the size of a small country. 🚀"
message.industryMid: "**INDUSTRY.** You join Big Tech (狗家 Goggle / 香蕉 Banana / 软软 Mikrohard) as a **Senior Applied Scientist**. Great pay, great GPUs, and your papers actually shipped into products."
message.industryGood: "**INDUSTRY.** You land a solid **Machine Learning Engineer** role at a well-known company. Comfortable, stable, and nobody will ever reject your paper again."
message.industryStartup: "**INDUSTRY — STARTUP.** You join a scrappy AI startup (Mythral / Unicorn.ai) as an early **ML engineer**. Equity lottery ticket in hand, you bet on the moonshot. 🦄"

# ---------------------------------------------------------------------------
# Citations
# ---------------------------------------------------------------------------
message.wellCitedNow: Your papers crossed **50 citations**. People cite you as a baseline now — reviewers recognize the line of work, and your acceptance odds tick up.
message.influentialNow: You crossed **200 citations** and got your first **invited talk**. You're an established name in the field now — acceptances come easier and your morale is steady.
message.paperCited: One of your papers is picking up citations (and a few followers on X). You feel recognized.
message.acceptedPoster: It's a **poster**. Most papers are — it'll go in the proceedings and get seen at the session. Whether anyone cites it is another matter.
message.acceptedSpotlight: It's a **spotlight**! Highlighted in the program with a short talk — good visibility, and the citations should follow.
message.acceptedOral: It's an **oral**! Top of the program, a full talk in front of everyone. This is the kind of paper that makes a reputation — citations incoming.

# ---------------------------------------------------------------------------
# Getting scooped
# ---------------------------------------------------------------------------
message.ideaDoneByOthers: You woke up to an **arXiv preprint** doing exactly your idea. Scooped. You can no longer work on it.
message.prelimDoneByOthers: A lab with 10x your compute just posted your preliminary result on arXiv. Scooped again.
message.goodIdea: Your advisor thinks the idea is genuinely promising. You feel encouraged.
message.figureInvalid: While re-checking your eval script, you found a bug that invalidates one of your plots. You must rerun that experiment.

# ---------------------------------------------------------------------------
# GPU cluster / infrastructure
# ---------------------------------------------------------------------------
message.equipmentBroken: The GPU cluster went down — a rack overheated and the scheduler is unresponsive.
message.doNothing: Wait it out.
message.cannotUseEquipment: You can't run any experiments until the cluster comes back. Painful.
message.fixEquipment: Try to debug it yourself.
message.contactEquipmentSupport: File a ticket with the sysadmins.
message.equipmentFixed: You found the dead node, drained it, and resubmitted your jobs. It works! Praise SLURM.
message.equipmentNotFixed: You poked at it for hours, but the queue is still stuck.
message.equipmentFixedByTechSupport: The sysadmins rebooted the rack and your jobs are running again.
message.equipmentNotFixedByTechSupport: The sysadmins are on it, but the issue is deeper than expected and will take longer to fix.
message.newEquipment: Your advisor bought a fresh **H100 node** for the lab. More compute every month, and experiments succeed more often.
message.cloudStorage: "LAB NEWS: the group set up **automatic checkpointing** to a cloud bucket. Your runs are safe now."

# ---------------------------------------------------------------------------
# Conference travel
# ---------------------------------------------------------------------------
message.attendConf: You travel to the conference, present your work, and meet a lot of people. Let's see what's on tomorrow's schedule.
message.skipConfSession: Skip the sessions and explore the city.
message.confNiceTour1: The city is gorgeous and you came back from the walk recharged.
message.confNiceTour2: You found an amazing hole-in-the-wall restaurant and ate very well.
message.skipConfSessionFail1: You bumped into your advisor while skipping a session. Awkward.
message.skipConfSessionFail2: Your advisor looked for you at the lab's poster and couldn't find you.
message.attendConfSession: Attend talks and network at the poster sessions.
message.confNewIdea: You caught a brilliant talk and, chatting at a poster afterward, landed **a new idea** — and a few new citations.
message.confNoNewIdea: The talks were great, the dinner better, and a few people told you they're citing your work.

# ---------------------------------------------------------------------------
# Advisor nudges
# ---------------------------------------------------------------------------
message.tooManyIdeas: 'Your advisor emailed: "You have plenty of ideas — now please turn one of them into an actual result."'
message.notEnoughPapers: Your advisor pinged you about your publication count, clearly anxious to see more accepted papers.
message.rejectedPaperAdvisor: 'Your advisor messaged you about the rejection: "Don''t let Reviewer 2 get to you. Cool off, address the comments, resubmit."'

# ---------------------------------------------------------------------------
# Rebuttal period
# ---------------------------------------------------------------------------
message.rebuttalPeriod: The reviews are in and the **rebuttal period** has opened. The scores are mixed. Will you spend the week writing a rebuttal?
message.writeRebuttal: Write a strong, data-backed rebuttal.
message.rebuttalWritten: You ran the extra experiments the reviewers wanted and wrote a crisp, point-by-point rebuttal. Acceptance odds **boosted** for now.
message.skipRebuttal: Don't bother — the scores won't move.
message.rebuttalSkipped: You decided the decision was already made and skipped the rebuttal.

# ---------------------------------------------------------------------------
# Internships
# ---------------------------------------------------------------------------
message.applyInternship: Apply for summer internships.
message.noInternOffer: You ground through coding interviews and take-homes for weeks — but no offer landed this cycle. The month is gone. Build up your record and try again.
message.recruiterReachout: "A recruiter emails you directly (your advisor may have put in a word): your papers caught a top lab's eye, and they're offering a **research internship** — serious compute, and you can publish. Accept?"
message.acceptInternship: Accept the internship.
message.declineInternship: Decline — stay and focus on your thesis.
message.internshipDeclined: You turned it down to stay focused on your own research. Your advisor was pleased with your commitment.
message.internFrontierLab1: You interned at **DeepKind**. Near-infinite TPUs, brilliant mentors, and you shipped a paper. You came back loaded with compute credits, citations, and a fat letter of recommendation.
message.internFrontierLab2: A summer at **OpenAEye** on a frontier team. You touched a model bigger than your whole department's cluster — and got to publish. Reputation through the roof.
message.internBigTechResearch1: You interned at **狗家 (Goggle) Brain**. A real research role — big compute, smart collaborators, and a publishable project.
message.internBigTechResearch2: A research internship at **脸谱 (Faceplant) AI Research**. Plenty of GPUs and a paper to show for it.
message.internProduct1: You interned on a **香蕉 (Banana)** product team. Great pay and decent compute — but it was a product role under NDA, so **no publication**. Your advisor wasn't thrilled.
message.internProduct2: A product internship at **亚麻 (Amazoom)**. Good money, shipped a feature to millions — but nothing you could put on arXiv.
message.internGpuRich1: You interned at **黄狗 (NWidia)**. They handed you a **mountain of GPUs** and said "go." Compute for days.
message.internGpuRich2: A summer at **字节 (ByteDunce)**. Absurd amounts of compute and a fast-moving team; you came back GPU-rich.
message.internStartup1: You joined a scrappy startup, **Mythral**, for the summer. Tiny cluster, huge velocity — you shipped fast and learned a ton.
message.internStartup2: An internship at **Unicorn.ai**. Move fast, break models. Little compute but a pile of fresh ideas.


ui.hopeMeter: Hope {{player.hope}}/100
ui.timeMeter: Year {{year}} Month {{month}}

# ---------------------------------------------------------------------------
# Items
# ---------------------------------------------------------------------------
item.idea: Research Idea
item.idea.description: A spark of a research idea, scribbled on a whiteboard. Run a quick experiment to see if it has any signal.
item.preliminaryResult: Toy-Scale Result
item.preliminaryResult.description: A promising result on a tiny benchmark (CIFAR-sized). It might scale into a real, headline result.
item.majorResult: SOTA Result
item.majorResult.description: A state-of-the-art result that beats the strong baselines. With {{rule.figuresRequired}} solid plots / ablations, you can draft a paper.
item.figure: Plot / Ablation
item.figure.description: A clean figure or ablation table that survives scrutiny. With {{rule.figuresRequired}} of them plus a SOTA result, you can draft a paper.
item.submittedPaper: Under Review
item.submittedPaper.description: A submission sitting on OpenReview, awaiting the verdict of three anonymous reviewers (and an AC).
item.resubmittedPaper: Resubmission Under Review
item.resubmittedPaper.description: A revised submission sent to the next deadline, awaiting another round of reviews.
item.paper: Accepted Paper
item.paper.description: An accepted paper at a top-tier conference. A real line on your CV!
item.rejectedPaper: Rejected Submission
item.rejectedPaper.description: A rejected submission. Address the reviews, polish, and resubmit to the next deadline.
item.conferencePaper: Workshop Paper
item.conferencePaper.description: An accepted (non-archival) workshop paper. Plants a flag on your idea so others are less likely to scoop you.
item.submittedConfPaper: Workshop Submission
item.submittedConfPaper.description: A workshop submission awaiting a quick review.

# ---------------------------------------------------------------------------
# Status effects
# ---------------------------------------------------------------------------
status.firstYear: First-Year Hype
status.firstYear.description: "**+1 hope** every month. Everything is exciting before your first rejection."
status.brokenEquipment: GPU Cluster Down
status.brokenEquipment.description: The cluster is unreachable. You cannot run experiments this month.
status.callForPapers: Workshop CFP Open
status.callForPapers.description: A workshop is calling for papers. With a toy-scale result you can submit a short paper.
status.upgradedEquipment: New GPU Node
status.upgradedEquipment.description: Your advisor secured fresh H100s. Your experiments are more likely to succeed.
status.cloudStorage: Auto-Checkpointing
status.cloudStorage.description: Checkpoints are synced to a cloud bucket automatically. A crash is far less likely to wipe your results.
status.strongRebuttal: Strong Rebuttal
status.strongRebuttal.description: You wrote a compelling, data-backed rebuttal. Your acceptance odds are temporarily boosted.
status.exhaustion: Burnout
status.exhaustion.description: "**-5 hope** every month. Time to step away from the terminal and rest."
status.lateYearAnxiety: Senior-Student Anxiety
status.lateYearAnxiety.description: "**-1 hope** every month. You keep wondering if you will ever graduate."
status.unhappyAdvisor: Unhappy Advisor
status.unhappyAdvisor.description: "**-5 hope** every month. Your advisor is not impressed with your recent progress."

# ---------------------------------------------------------------------------
# Qualifying / prelim exam
# ---------------------------------------------------------------------------
message.qualifyNotice: "DEPARTMENT NOTICE: All PhD students must pass the **qualifying exam in December**."
message.prepareQualify: Study for the qualifying exam.
message.qualifyLevelUp: You felt more confident about passing the qualifying exam.
message.qualifyLevelMax: You felt **very confident** about passing the qualifying exam.
message.qualifyPassed: You **PASSED** the qualifying exam.
message.qualifyFailed: You **FAILED** the qualifying exam.

# ---------------------------------------------------------------------------
# Burnout
# ---------------------------------------------------------------------------
message.exhaustion: After months of back-to-back deadlines and 3 a.m. training runs, you began to burn out and could not focus.
message.exhaustionBreak: Your advisor noticed you looked wrecked lately and sent you an article about sustainable research and work-life balance.
message.takeBreak: Ask your advisor for a few days off.
message.recoveredAfterBreak: Your advisor approved it. You logged off Slack, slept, and came back **reinvigorated**.
message.noBreak: I'm fine, really.
message.exhaustionIgnored: You told yourself the deadline was more important and kept grinding.
message.exhaustionBadMonth: You stared at the loss curve for hours but nothing went in. Your brain is fried and you need a real break.
message.exhaustionNoProgress: You forced yourself to keep coding, but it did not help. No progress this month.

# ---------------------------------------------------------------------------
# Senior-student anxiety
# ---------------------------------------------------------------------------
message.lateYearAnxiety: Three years in. You have watched cohort after cohort defend and leave, and you start to worry whether you will graduate on time.

# ---------------------------------------------------------------------------
# Compute budget / funding
# ---------------------------------------------------------------------------
message.fundingRises: "AI NEWS: a wave of new grants and industry gifts is flowing into ML labs. \"Compute is the new oil,\" a program manager declared."
message.fundingFalls: "AI NEWS: GPU prices spiked and several grants were frozen this fiscal year. Compute budgets are likely to tighten."
message.moreFunding: Your advisor landed a new grant (and a pile of cloud credits). The whole lab celebrated.
message.lessFunding: Your advisor's grant renewal stalled. The lab quietly started rationing GPU hours.
message.lostFunding: A cloud bill came due and one project's **compute budget was slashed**. The lab is on edge.

# ---------------------------------------------------------------------------
# Unhappy advisor
# ---------------------------------------------------------------------------
message.unhappyAdvisor: Your advisor seems unimpressed with your recent progress. "Research is hard, but I'd like to see more momentum from you."
message.advisorHappyAgain: Your advisor seems genuinely pleased with your recent progress.

# ---------------------------------------------------------------------------
# Main game flow
# ---------------------------------------------------------------------------
message.beginning: Congratulations — you've been **admitted** to a top AI PhD program. Will you accept the offer?
message.acceptOffer: Accept the offer.
message.acceptedOffer: You accepted and joined a lab. To graduate, you must publish at least **{{rule.papersRequired}} papers** at top-tier conferences (think NeurIPS / ICML / ICLR / CVPR / ACL).
message.declineOffer: Decline and take the big-tech job.
message.declinedOffer: You declined the offer and took a well-paid research-engineer role instead. Perhaps the wiser timeline.
message.newMonth: A new month begins. Let's check the to-do list.
message.readPapers: Read papers on arXiv.
message.gainNewIdea1: After scrolling through arXiv-sanity and a dozen abstracts, a **new research idea** clicked.
message.gainNewIdea2: After staring at a related-work section for hours, you spotted a gap and got a **new idea**.
message.workOnIdea: Run a quick experiment on an idea.
message.oldIdea1: You pitched the idea to your advisor, who pulled up a 2019 paper that already did exactly this.
message.oldIdea2: Your advisor thought the idea was incremental and asked you to think bigger.
message.oldIdea3: Your advisor felt the idea was not novel enough and told you to read more of the recent literature.
message.oldIdea4: You had a burst of ideas — but a quick Semantic Scholar search showed every one of them was already published.
message.noIdea1: You opened 60 arXiv tabs and your browser **crashed**. You lost track of everything you were reading.
message.gainPrelimResult: The idea shows signal on a toy benchmark! You have a **toy-scale result**.
message.ideaNotWorking: The idea flatlined — no better than the baseline. On to the next one.
message.workOnPrelimResult: Scale up a toy-scale result.
message.gainMajorResult: It scales! You beat the strong baselines and have a **SOTA result**.
message.noMajorResult1: You're sure there's a real result here, but training keeps diverging at scale. You need more time.
message.noMajorResult2: Your advisor spotted a data-leakage bug that inflated your numbers. Back to the drawing board.
message.workOnFigure: Run ablations and make plots.
message.gainFigure: The ablations are clean and convincing. You produced a beautiful **plot**.
message.noFigure1: The runs came back noisy and inconclusive. You'll need more seeds and more compute.
message.noFigure2: Your job hit **CUDA out of memory** and died at epoch 47. Time to redo it with gradient checkpointing.
message.noFigure3: The training run is taking far longer than expected; the results aren't in yet.
message.noFigure4: A dependency upgrade broke your environment. You burned days fixing CUDA / PyTorch versions and need more time.
message.lostData: A node crashed mid-run and your checkpoints were lost. You'll have to rerun the experiments.
message.lostDataRecovered: A node crashed mid-run — but auto-checkpointing **restored** everything from the cloud bucket, and you got your **plot**.
message.wrongFigure: Your numbers contradict each other; there's a bug somewhere in the eval. You need time to track it down.
message.workOnPaper: Write the paper.
message.draftPaperComplete: You finished the draft and **submitted** it before the deadline!
message.draftPaperIncomplete1: Your advisor was too swamped to read the draft this cycle.
message.draftPaperIncomplete2: Despite your efforts, the related-work section still needs work. Not done yet.
message.draftPaperIncomplete3: Despite your efforts, the experiments section needs more analysis. Not done yet.
message.draftPaperIncomplete4: You spent the whole month fighting LaTeX figure placement and the 9-page limit. Still not done.
message.draftPaperIncomplete5: There are still a couple of sections half-written. Almost there.
message.draftPaperIncomplete6: Your advisor read the draft and wants the abstract and intro completely rewritten.
message.draftPaperIncomplete7: Your advisor flagged several figures as unconvincing. You'll need more time to fix them.
message.paperAccepted: "OPENREVIEW: We are delighted to inform you that your submission has been **ACCEPTED**! Average rating: strong accept."
message.paperRejected1: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. Reviewer 2 wrote: \"Novelty is limited; this is an incremental delta over prior work.\""
message.paperRejected2: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer found a flaw in your theoretical derivation."
message.paperRejected3: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"The improvements are within noise; no error bars are reported.\""
message.paperRejected4: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer demanded comparison against three more recent baselines."
message.paperRejected5: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"Why does it work? No insight or analysis is provided.\""
message.paperRejected6: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer found the paper unreadable and the notation inconsistent."
message.paperRejected7: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer questioned whether results hold beyond your cherry-picked setting."
message.paperRejected8: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"Interesting, but not a NeurIPS-level contribution.\""
message.paperRejected9: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer demanded experiments on ImageNet-scale data and a 7B model."
message.paperRejected10: "OPENREVIEW: We regret to inform you that your submission has been **REJECTED**. A reviewer wrote: \"No code or reproducibility statement provided. Score: 3.\""
message.revisePaper: Revise and resubmit a rejected paper.
message.revisionComplete: You addressed the reviews point by point, ran the requested experiments, and resubmitted to the next deadline.
message.resubmittedPaperAccepted: "OPENREVIEW: Great news — your resubmission has been **ACCEPTED**!"
message.resubmittedPaperRejected1: "OPENREVIEW: We regret to inform you that your resubmission was **REJECTED** again. (You drew the same Reviewer 2.)"
message.slackOff: Slack off (touch grass).
message.caughtSlackOff1: Your advisor caught you off Slack for a week and pinged you a long list of TODOs.
message.caughtSlackOff2: Your advisor stopped by the lab, found your seat empty, and emailed asking about your progress.
message.caughtSlackOff3: Your advisor sent three messages with no reply, then asked the whole group when you'd last pushed code.
message.slackOffSuccess: You went hiking, ignored OpenReview for a weekend, and felt human again.
message.lostAllHope: You lost all hope and **dropped out** to take an industry job.
message.overdue: You **ran out of time** and could not finish your PhD.
message.workOnThesis: Write and defend your thesis.
message.graduated: Congratulations! You stapled your papers into a thesis and passed your defense. You **earned your PhD**! Dr. You-Now. Be proud!

# ---------------------------------------------------------------------------
# Getting scooped
# ---------------------------------------------------------------------------
message.ideaDoneByOthers: You woke up to an **arXiv preprint** doing exactly your idea. Scooped. You can no longer work on it.
message.prelimDoneByOthers: A lab with 10x your compute just posted your preliminary result on arXiv. Scooped again.
message.goodIdea: Your advisor thinks the idea is genuinely promising. You feel encouraged.
message.figureInvalid: While re-checking your eval script, you found a bug that invalidates one of your plots. You must rerun that experiment.

# ---------------------------------------------------------------------------
# GPU cluster / infrastructure
# ---------------------------------------------------------------------------
message.equipmentBroken: The GPU cluster went down — a rack overheated and the scheduler is unresponsive.
message.doNothing: Wait it out.
message.cannotUseEquipment: You can't run any experiments until the cluster comes back. Painful.
message.fixEquipment: Try to debug it yourself.
message.contactEquipmentSupport: File a ticket with the sysadmins.
message.equipmentFixed: You found the dead node, drained it, and resubmitted your jobs. It works! Praise SLURM.
message.equipmentNotFixed: You poked at it for hours, but the queue is still stuck.
message.equipmentFixedByTechSupport: The sysadmins rebooted the rack and your jobs are running again.
message.equipmentNotFixedByTechSupport: The sysadmins are on it, but the issue is deeper than expected and will take longer to fix.
message.newEquipment: Your advisor bought a fresh **H100 node** for the lab. Everyone was thrilled.
message.cloudStorage: "LAB NEWS: the group set up **automatic checkpointing** to a cloud bucket. Your runs are safe now."

# ---------------------------------------------------------------------------
# Workshop / conference cycle
# ---------------------------------------------------------------------------
message.callForPapers: A **NeurIPS workshop** just opened its call for papers. Submissions are open for the next **6 months** — if you have a toy-scale result, you can submit a short paper.
message.workOnConf: Write a workshop paper.
message.finishedConfPaper: You wrote up the workshop paper and submitted it!
message.confPaperRejected: Your workshop submission was **REJECTED** — the reviewers weren't convinced it was ready. You can keep developing the result, though.
message.confPaperAccepted1: "INBOX: Your work was **ACCEPTED** as a **poster** at the workshop. Time to make a poster."
message.confPaperAccepted2: "INBOX: Your work was **ACCEPTED** for a **spotlight talk** at the workshop. Congrats!"
message.attendConf: You arrive at the **NeurIPS** convention center and give your presentation. Let's see what's on tomorrow's schedule.
message.skipConfSession: Skip the sessions and explore the city.
message.confNiceTour1: The city is gorgeous and you came back from the walk recharged.
message.confNiceTour2: You found an amazing hole-in-the-wall restaurant and ate very well.
message.skipConfSessionFail1: You bumped into your advisor while skipping a session. Awkward.
message.skipConfSessionFail2: Your advisor looked for you at the lab's poster and couldn't find you.
message.attendConfSession: Attend talks and network at the poster sessions.
message.confNewIdea: You caught a brilliant talk and, chatting at a poster afterward, landed **a new idea**.
message.confNoNewIdea: The talks were great and the conference dinner was even better.

# ---------------------------------------------------------------------------
# Advisor nudges
# ---------------------------------------------------------------------------
message.qualifyReminder: Your advisor worried you weren't preparing for the qualifying exam and told you to take it seriously.
message.tooManyIdeas: 'Your advisor emailed: "You have plenty of ideas — now please turn one of them into an actual result."'
message.notEnoughPapers: Your advisor pinged you about your publication count, clearly anxious to see more accepted papers.
message.rejectedPaperAdvisor: 'Your advisor messaged you about the rejection: "Don''t let Reviewer 2 get to you. Cool off, address the comments, resubmit."'

# ---------------------------------------------------------------------------
# Rebuttal period (new)
# ---------------------------------------------------------------------------
message.rebuttalPeriod: The reviews are in and the **rebuttal period** has opened. The scores are mixed. Will you spend the week writing a rebuttal?
message.writeRebuttal: Write a strong, data-backed rebuttal.
message.rebuttalWritten: You ran the extra experiments the reviewers wanted and wrote a crisp, point-by-point rebuttal. Acceptance odds **boosted** for now.
message.skipRebuttal: Don't bother — the scores won't move.
message.rebuttalSkipped: You decided the decision was already made and skipped the rebuttal.

# ---------------------------------------------------------------------------
# Industry internship (new)
# ---------------------------------------------------------------------------
message.internshipOffer: A top industry lab (think a frontier-model team) offers you a **summer research internship** — huge compute, smart mentors, and a possible publication. Take it?
message.acceptInternship: Accept the internship.
message.internshipAccepted: You spent the summer with near-unlimited GPUs and brilliant collaborators. You came back with **a new idea**, fresh compute credits, and renewed energy — though your advisor wished you'd stayed to push your thesis.
message.declineInternship: Stay and focus on your thesis.
message.internshipDeclined: You turned it down to stay focused on your own research. Your advisor was pleased with your commitment.

# ---------------------------------------------------------------------------
# Random morale events
# ---------------------------------------------------------------------------
message.paperCited: Your recent paper is picking up citations (and a few followers on X). You feel recognized.
message.seminar1: You attended a lab seminar this month; the speaker's slides sparked **a new idea**.
message.seminar2: You attended a seminar this month; a sharp question in the Q&A gave you **a new idea**.
message.seminar3: A distinguished speaker gave an inspiring colloquium and you suddenly had **a new idea**.
message.showerIdea: The missing trick came to you in the shower. One of your toy-scale results just became a **SOTA result**.
message.randomHope1: A new AI art exhibit opened downtown. You visited and loved it. You feel relieved.
message.randomHope2: There was a free outdoor concert near campus. You let the music wash away the deadline stress.
message.randomHope3: Your lab threw a paper-acceptance party. Great food, great people. You felt much better.
message.randomHope4: A new ramen place opened near your apartment. You went, it was incredible, and you felt much better.
message.randomHope5: The mechanical keyboard in your cart finally went on sale. You bought it instantly and felt great.
message.modelViral1: You open-sourced your model and it hit the **top of Hugging Face trending**. Your GitHub stars are exploding.
message.modelViral2: A demo of your method went **viral on X** overnight. Even a famous researcher reposted it.


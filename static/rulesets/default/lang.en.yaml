ui.helpButton: Help
ui.helpTitle: Help
ui.helpContent: "You are an AI PhD student. Each month, pick **one** action. The research pipeline: read arXiv → idea → run an experiment (costs **compute**) → a toy result → scale up (or **train a large model** with lots of compute) → a SOTA result → ablations/plots → write a draft → **submit at a real conference deadline** (ICLR, ICML, NeurIPS, CVPR) → wait months for reviews. Watch your **GPU compute** (top-left): it's a *monthly* allowance that **resets each month** — you can't hoard it, so a large model needs a compute-rich lab, funding, an internship, or a fellowship, not saving up. Publish **{{rule.papersRequired}} papers** at top venues to graduate. **Citations** (top-right) build your reputation, raising acceptance odds and scaring off scoopers. Keep **Hope** above 0. **Reviewer 2 can be brutal.**"
ui.aboutButton: About
ui.aboutTitle: About
ui.aboutContent: "**AI PhD Simulator** — a text-based simulation of life as a machine-learning PhD student: arXiv, GPU budgets, real conference deadlines, Reviewer 2, rebuttals, citations, scooping and burnout. Reskinned from the original **PhD Simulator** by Mianzhi Wang (MIT License). Bilingual: switch between English and 中文 in the footer."

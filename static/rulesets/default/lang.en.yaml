# UI
ui.ok: Ok.
ui.items: "Items:"
ui.status: "Status:"
ui.github: GitHub
ui.helpButton: Help
ui.helpTitle: Help
ui.helpContent: "You are an AI PhD student. Each month, pick **one** action: read papers (arXiv), turn an idea into a quick experiment, scale it into a **SOTA result**, run ablations to get plots, then write a paper and submit to a top venue. You need **{{rule.papersRequired}} accepted papers** at top-tier conferences to graduate. Watch your **Hope** — if it hits 0, you drop out. Outcomes are decided by a random number generator, so do not take rejections personally. **Reviewer 2 can be brutal.**"
ui.aboutButton: About
ui.aboutTitle: About
ui.aboutContent: "**AI PhD Simulator** — a text-based simulation of life as a machine-learning PhD student: arXiv, GPUs, NeurIPS deadlines, Reviewer 2, rebuttals, scooping and burnout. Reskinned from the original **PhD Simulator** by Mianzhi Wang (MIT License). Bilingual: switch between English and 中文 in the footer."
ui.seedButton: Seed
ui.seedTitle: Seed
